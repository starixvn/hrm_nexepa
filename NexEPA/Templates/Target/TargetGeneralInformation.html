<div ng-controller="TargetGeneralInformationController">
    <form class="col-sm-5 form-horizontal common-form info-form" name="createForm" novalidate>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name"></label>
            <div class="col-sm-8">
                <input class="form-control" maxlength="500" name="targetName" ng-disabled="!isEditMode || permission.policy == 1" 
                    ng-model="target.name" required type="text"/>
            </div>
        </div>

        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Project"></label>
            <div class="col-sm-8">
                    <select name="targetProjectSelect" ng-model="target.projectId"
                    ng-options="opt.id as opt.name for opt in projectOptions"
                    ng-change="projectOnChange(target.projectId)" ng-disabled="!isEditMode || permission.policy == 1"
                    required class="form-control">
                    <option value="">-- Select the project --</option>
                    </select>
            </div>
        </div>

        <div class="form-group" ng-show="isSelectedProject">
            <label class="col-sm-3 control-label" data-translate="Milestone"></label>
            <div class="col-sm-8">
                    <select name="targetMilestoneSelect" ng-model="target.milestoneId"
                    ng-disabled="!isEditMode || permission.policy == 1"
                    ng-options="opt.milestoneId as opt.name for opt in milestoneOptions"
                    class="form-control">
                    <option value="">-- Select the milestone --</option>
                    </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Status"></label>
            <div class="col-sm-8">
                    <select name="targetStatusSelect" ng-model="target.status"
                    ng-disabled="!isEditMode || permission.policy == 1"
                    ng-options="opt.id as opt.name for opt in statusOptions"
                    class="form-control">
                    </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="StartDate"></label>
            <div class="col-sm-8">
                <input class="calendar-form-control" type="text" ng-model="target.startDate" datepicker-popup="{{dateFormat}}" 
                    ng-disabled="!isEditMode || permission.policy == 1" is-open="calendar.startDateOpened" show-button-bar="false"/>
                <calendar-image class="calendar-image" ng-click="openPopupStartDate($event)" ng-show="isEditMode" ng-if="permission.policy == 2"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="EndDate"></label>
            <div class="col-sm-8">
                <input class="calendar-form-control" type="text" ng-model="target.endDate" datepicker-popup="{{dateFormat}}"
                     ng-disabled="!isEditMode || permission.policy == 1" is-open="calendar.endDateOpened" show-button-bar="false"/>
                <calendar-image class="calendar-image" ng-click="openPopupEndDate($event)" ng-show="isEditMode" ng-if="permission.policy == 2"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Description"></label>
            <div class="col-sm-8">
                <textarea ng-model="target.description" ng-disabled="!isEditMode || permission.policy == 1" class="form-control" ></textarea>
            </div>
        </div>

        <div class="form-group" ng-show="isEditMode">
            <div class="col-sm-offset-3 col-sm-8">
                <button class="button" ng-click="save(target)" ng-disabled="disabledSubmit" data-translate="Save" ng-if="permission.policy == 2">
                </button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
