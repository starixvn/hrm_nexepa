<div ng-controller="TargetGeneralInformationController">
    <form class="col-sm-5 form-horizontal common-form info-form" name="createForm" novalidate>
        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="Name"></label>
            <div class="col-sm-7">
                <input class="form-control" maxlength="500" name="targetName" ng-disabled="!isEditMode || permission.policy == 1" 
                    ng-model="target.name" required type="text"/>
            </div>
        </div>

        <div class="form-group required">
            <label class="col-sm-4 control-label" data-translate="Project"></label>
            <div class="col-sm-7">
                    <select name="targetProjectSelect" ng-model="target.projectId"
                    ng-options="opt.id as opt.name for opt in projectOptions"
                    ng-change="projectOnChange(target.projectId)" ng-disabled="!isEditMode || permission.policy == 1"
                    required class="form-control">
                    </select>
            </div>
        </div>

        <div class="form-group" ng-show="isSelectedProject && milestoneOptions">
            <label class="col-sm-4 control-label" data-translate="Milestone"></label>
            <div class="col-sm-7">
                    <select name="targetMilestoneSelect" ng-model="target.milestoneId"
                    ng-disabled="!isEditMode || permission.policy == 1"
                    ng-options="opt.milestoneId as opt.name for opt in milestoneOptions"
                    class="form-control">
                    <option value="">-- Select the milestone --</option>
                    </select>
            </div>
        </div>

		<div class="form-group required" ng-if="isEditProjectManager && isSelectedProject">
            <label class="col-sm-4 control-label" data-translate="ProjectManager"></label>
            <div class="col-sm-7">
                 <select name="targetProjectManagerSelect" ng-model="target.projectManagerId"
                    ng-options="opt.employeeId as opt.nickName + ' (' + opt.fullName + ')' for opt in projectManagerOptions"
                    class="form-control" required ng-disabled="!isEditMode || permission.policy == 1">
                    <option value="">-- Select the Project Manager --</option>
                 </select>
            </div>
			<div class="col-sm-1 target-project-manager project-manager-icon" >
				<a class="btn-cancel" href="javascript:;" ng-click="cancelEditPM()" title="Cancel"></a>
			</div>
        </div>

		<div class="form-group" ng-if="!isEditProjectManager && isSelectedProject">
			<label class="col-sm-4 control-label" data-translate="ProjectManager"></label>
			<div class="col-sm-7 target-project-manager">
				<span ng-bind="projectManagerName"></span>
			</div>
			<div class="col-sm-1 target-project-manager project-manager-icon" ng-if="isEditMode && permission.policy == 2">
				<a class="btn-edit" href="javascript:;" ng-click="editPM()" title="Edit PM"></a>
			</div>
		</div>

        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="Status"></label>
            <div class="col-sm-7">
                    <select name="targetStatusSelect" ng-model="target.status"
                    ng-disabled="!isEditMode || permission.policy == 1"
                    ng-options="opt.id as opt.name for opt in statusOptions"
                    class="form-control">
                    </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="StartDate"></label>
            <div class="col-sm-7">
                <input class="calendar-form-control" type="text" ng-model="target.startDate" datepicker-popup="{{dateFormat}}" 
                    ng-disabled="!isEditMode || permission.policy == 1" is-open="calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="openPopupStartDate($event)" ng-show="isEditMode" ng-if="permission.policy == 2"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="EndDate"></label>
            <div class="col-sm-7">
                <input class="calendar-form-control" type="text" ng-model="target.endDate" datepicker-popup="{{dateFormat}}"
                     ng-disabled="!isEditMode || permission.policy == 1" is-open="calendar.endDateOpened" />
                <calendar-image class="calendar-image" ng-click="openPopupEndDate($event)" ng-show="isEditMode" ng-if="permission.policy == 2"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-4 control-label" data-translate="Description"></label>
            <div class="col-sm-7">
                <textarea ng-model="target.description" ng-disabled="!isEditMode || permission.policy == 1" class="form-control" ></textarea>
            </div>
        </div>

        <div class="form-group" ng-show="isEditMode">
            <div class="col-sm-offset-4 col-sm-8">
                <button class="button" ng-click="save(target)" ng-disabled="disabledSubmit" data-translate="Save" ng-if="permission.policy == 2">
                </button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
