<div ng-controller="TargetKPIController">
    <div class="row">
        <div class="form-inline filter target-kpi-table">
            <form novalidate class="form-inline">
                <div class="form-group pull-left">
                    <label data-translate="Group"></label>
                    <select ng-model="filter.kpiGroupId" ng-options="opt.kpiGroupId as opt.name for opt in groupOptions" class="form-control">
                        <option value="">-- All --</option>
                    </select>
                </div>
                <div class="form-group pull-left">
                    <button class="button" ng-click="filter(filter.kpiGroupId)" ng-disabled="disabledSubmitButton" data-translate="Submit"></button>
                </div>
                <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
            </form>
        </div>
    </div>

    <div class="row">
        <table class="table table-bordered table-striped target-kpi-table">
            <thead>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Name"></th>
                <th data-translate="Weight"></th>
                <th data-translate="Action" ng-show="isEditMode && permissionMemberEPA.policy > 0"></th>
            </thead>
            <tbody ng-repeat="kpiGroupItem in listGroupKPI">
                <tr class="target-kpi-group">
                    <td class="row-highlight"></td>
                    <td class="row-highlight" ng-bind="kpiGroupItem.group.name"></td>
                    <td class="row-highlight target-kpi-weight" ng-bind="kpiGroupItem.group.weight"></td>
                    <td ng-if="isEditMode && permissionMemberEPA.policy > 0"></td>
                </tr>
                <tr ng-repeat="kpiItem in kpiGroupItem.kpIs">
                    <td class="count" ng-bind="calculateIndex($parent.$index, $index, listGroupKPI)" ></td>
                    <td ng-bind="kpiItem.name"></td>
                    <td class="target-kpi-weight">
                        <span ng-bind="kpiItem.weight" ng-show="!kpiGroupItem.group.isSpreadKPI"></span>
                        <span ng-bind="'-'" ng-show="kpiGroupItem.group.isSpreadKPI"></span>
                    </td>
                    <td class="target-center" ng-if="isEditMode && permissionMemberEPA.policy > 0">
                      <a class="glyphicon glyphicon-new-window new-rating" title="Evalute" href="" 
                          ng-click="evaluate(kpiGroupItem.group, kpiItem)" 
                          ng-show="!rating.isRating{{kpiItem.kpiId}}"/>
                      <a class="glyphicon glyphicon-saved epa-saved" title="Done" href="" 
                          ng-click="evaluate(kpiGroupItem.group, kpiItem)" 
                          ng-show="rating.isRating{{kpiItem.kpiId}} && rating.isAllRating{{kpiItem.kpiId}}"/>
                      <a class="glyphicon glyphicon-list-alt epa-unsaved" title="Not done" href="" 
                          ng-click="evaluate(kpiGroupItem.group, kpiItem)" 
                          ng-show="rating.isRating{{kpiItem.kpiId}} && !rating.isAllRating{{kpiItem.kpiId}}"/>
                    </td>
                </tr>
            </tbody>
            <tr ng-show="listGroupKPI == ''">
                <td colspan="3" class="empty-result" data-translate="EmptyResult"></td>
            </tr>
        </table>
    </div>
</div>
