<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Target" ng-click="cancel()"></a></li>
            <li class="current" data-translate="TargetDetail"></li>
        </ul>
		<a class="button-icon" ng-if="permission.policy == 2" href="" ng-click="editTarget()" ng-href={{editTargetUrl}}>
			<span class="glyphicon glyphicon-edit icon-edit"></span>
			<span class="button-text" data-translate="EditTarget"></span>
		</a>
    </div>
</div>
<div class="row target-tabset">
    <tabset>
        <tab active="tabGeneralSelect" heading="{{targetInformationHeading}}">
           <div ng-include src="'/Templates/Target/TargetGeneralInformation.html'">
           </div>
        </tab>

        <tab active="tabMemberSelect" heading="{{targetMembersHeading}}">
           <div ng-include src="'/Templates/Target/TargetMembers.html'">
           </div>
        </tab>

        <tab active="tabKPISelect" heading="{{targetKPIHeading}}">
           <div ng-include src="'/Templates/Target/TargetKPI.html'">
           </div>
        </tab>
    </tabset>
</div>
