
<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Target"></a></li>
            <li class="current" data-translate="EditTarget"></li>
        </ul>
        <div class="button-icon">
            <a href="" ng-click="cancel()" data-translate="BackToList">
            </a>
        </div>
    </div>
</div>

<div class="row">
    <form class="form-horizontal" name="createForm" novalidate>
         <div>
            <div ng-show="submitted && createForm.$invalid">
                <div class="error" ng-show="createForm.targetName.$error.required" data-translate="NameRequire" ></div>
                <div class="error" ng-show="createForm.targetName.$valid && createForm.targetFormSelect.$error.required" data-translate="FormRequire"></div>
                <div class="error" ng-show="createForm.targetName.$valid && createForm.targetFormSelect.$valid &&
                        createForm.targetProjectSelect.$error.required && formIsProject" data-translate="ProjectRequire"></div>
            </div>
            <div class="success" ng-show="success" ng-bind="successMessage"></div>
            <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Name"></label>
            <div class="col-sm-4">
                <input class="form-control" name="targetName" ng-model="target.name" required type="text"/>
            </div>
        </div>

         <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-4">
                 <select name="targetFormSelect" ng-model="target.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" 
                    ng-change="formOnChange(target.targetTypeId)"
                    required class="form-control">
                    <option value="">-- Select the form --</option>
                 </select>
            </div>
        </div>

        <div class="form-group" ng-show="formIsProject">
            <label class="col-sm-2 control-label" data-translate="Project"></label>
            <div class="col-sm-4">
                 <select name="targetProjectSelect" ng-model="target.projectId"
                    ng-options="opt.projectId as opt.name for opt in projectOptions"
                    ng-change="projectOnChange(target.projectId)"
                    required class="form-control">
                    <option value="">-- Select the project --</option>
                 </select>
            </div>
        </div>

        <div class="form-group" ng-show="isSelectedProject">
            <label class="col-sm-2 control-label" data-translate="Milestone"></label>
            <div class="col-sm-4">
                 <select name="targetMilestoneSelect" ng-model="target.milestoneId"
                    ng-options="opt.milestoneId as opt.name for opt in milestoneOptions"
                    class="form-control">
                    <option value="">-- Select the milestone --</option>
                 </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Status"></label>
            <div class="col-sm-4">
                 <select name="targetStatusSelect" ng-model="target.status"
                    ng-options="opt.status as opt.name for opt in statusOptions"
                    class="form-control">
                 </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="StartDate"></label>
            <div class="col-sm-4">
                <input type="text" ng-model="target.startDate" datepicker-popup="MMM dd,yyyy" is-open="startDateOpened" show-button-bar="false"/>
                <button class="btn-default glyphicon glyphicon-calendar" ng-click="openPopupStartDate($event)"></button>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="EndDate"></label>
            <div class="col-sm-4">
                <input type="text" ng-model="target.endDate" datepicker-popup="MMM dd,yyyy" is-open="endDateOpened" show-button-bar="false"/>
                <button class="btn-default glyphicon glyphicon-calendar" ng-click="openPopupEndDate($event)"></button>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-4">
                <textarea ng-model="target.description" class="form-control" ></textarea>
            </div>
        </div>

        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-primary" ng-click="save(target)" ng-disabled="disabledSubmit" data-translate="Save"></button>
            <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel"></button>
        </div>
    </form>
</div>
