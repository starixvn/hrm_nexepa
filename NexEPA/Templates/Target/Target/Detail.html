<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Target" ng-click="cancel()"></a></li>
            <li class="current" data-translate="TargetDetail"></li>
        </ul>
        <div class="button-icon">
            <span class="glyphicon glyphicon-edit icon-edit"></span>
            <a href="" ng-click="editTarget()" data-translate="EditTarget">
            </a>
        </div>
        <div class="button-icon">
            <span class="glyphicon glyphicon-arrow-left icon-back"></span>
            <a href="" ng-click="cancel()" data-translate="BackToList">
            </a>
        </div>
    </div>
</div>

<div class="row target-tabset">
    <tabset>
        <tab active="tabGeneralSelect" heading="{{targetInformationsHeading}}">
           <form class="col-sm-5 form-horizontal common-form">
                <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="Name"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.name"></div>
                </div>

                 <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="Form"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.targetType.name"></div>
                </div>

                <div class="form-group colons" ng-show="target.project.name">
                    <div class="col-sm-3 control-label" data-translate="Project"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.project.name"></div>
                </div>

                <div class="form-group colons" ng-show="target.milestone.name">
                    <div class="col-sm-3 control-label" data-translate="Milestone"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.milestone.name"></div>
                </div>

                <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="Status"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.statusName"></div>
                </div>

                <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="StartDate"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.startDate"></div>
                </div>

                <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="EndDate"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.endDate"></div>
                </div>

                <div class="form-group colons">
                    <div class="col-sm-3 control-label" data-translate="Description"></div>
                    <div class="col-sm-8 target-bold" ng-bind="target.description"></div>
                </div>
            </form>
        </tab>

        <tab active="tabMemberSelect" heading="{{targetMembersHeading}}">
            <table class="table table-bordered table-striped target-member-table">
                <thead>
                    <th data-translate="SymbolCount"></th>
                    <th data-translate="FullName"></th>
                    <th data-translate="NickName"></th>
                    <th data-translate="Team"></th>
                </thead>
                <tr ng-repeat="employee in employees">
                    <td class="index" ng-bind="$index + 1"></td>
                    <td ng-bind="employee.fullName"></td>
                    <td ng-bind="employee.nickName"></td>
                    <td ng-bind="employee.groupName"></td>
                </tr>
                <tr ng-show="employees == ''">
                    <td class="empty-result" colspan="5" data-translate="EmptyResult"></td>
                </tr> 
            </table>
        </tab>

        <tab active="tabKPISelect" heading="{{targetKPIHeading}}">
            <div class="row">
                <div class="form-inline filter target-col-sm-5">
                    <form novalidate class="form-inline">
                        <div class="form-group">
                            <label data-translate="Group"></label>
                            <select ng-model="filter.kpiGroupId" ng-options="opt.kpiGroupID as opt.name for opt in groupOptions" class="form-control">
                                <option value="">-- All --</option>
                            </select>
                            </div>
                        <button class="button btn-primary" ng-click="filter(filter.kpiGroupId)" ng-disabled="disabledSubmitButton" data-translate="Submit"></button>
                        <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
                    </form>
                </div>
            </div>

            <div class="row">
                <table class="table table-bordered table-striped target-kpi-table">
                    <thead>
                        <th class="index" data-translate="SymbolCount"></th>
                        <th data-translate="Name"></th>
                        <th data-translate="Group"></th>
                    </thead>
                    <tr ng-repeat="kpiItem in listKPI">
                        <td class="center" ng-bind="$index + 1"></td>
                        <td ng-bind="kpiItem.name"></td>
                        <td ng-bind="kpiItem.groupName"></td>
                    </tr>
                    <tr ng-show="listKPI == ''">
                        <td colspan="3" class="empty-result" data-translate="EmptyResult"></td>
                    </tr>
                </table>
            </div>
        </tab>
    </tabset>
</div>
