<div ng-controller="TargetMembersController">
    <div class="row" ng-show="isEditMode">
        <div class="form-inline filter target-col-sm-6">
            <form novalidate class="form-inline">
                <div class="form-group">
                    <label data-translate="Employee"></label>
                    <input class="form-control" ng-model="search.searchKey" placeholder="full name or nick name" ng-change="getEmployee(search.searchKey)"
                            search-auto-complete search-key="search.searchKey" search-employees="searchEmployees" project-id="projectId" employee="employee"/>
                </div>
                <button class="button" ng-click="addEmployee(employee)" ng-disabled="disabledSubmit" data-translate="Add"></button>
            </form>
        </div>
    </div>

    <div class="row">
        <table class="table table-bordered table-striped target-member-table">
            <thead>
                <th data-translate="SymbolCount"></th>
                <th data-translate="FullName"></th>
                <th data-translate="NickName"></th>
                <th data-translate="Team"></th>
                <th data-translate="Action" ng-show="isEditMode"></th>
            </thead>
            <tr ng-repeat="employee in employees">
                <td class="index" ng-bind="$index + 1"></td>
                <td ng-bind="employee.fullName"></td>
                <td ng-bind="employee.nickName"></td>
                <td ng-bind="employee.group.name"></td>
                <td class="action" ng-show="isEditMode">
                    <a class="glyphicon glyphicon-remove icon-remove" title="Delete" href="" ng-click="openDeletePopup(employee)"/>
                </td>
            </tr>
            <tr ng-show="employees == ''">
                <td class="empty-result" colspan="5" data-translate="EmptyResult"></td>
            </tr> 
        </table>
    </div>
</div>
