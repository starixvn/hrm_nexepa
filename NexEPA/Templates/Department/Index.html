<div class="row sub-header">
	<ul class="col-xs-12 breadcrumb list-inline pull-left">
		<li>
			<a href="/Department/Index" data-translate="Company"></a>
		</li>
		<li class="current" data-translate="Department"></li>
	</ul>
</div>
<div class="row">
	<div class="col-sm-4 treeview">
		<div class="tree">
			<ul>
				<li ng-repeat="data in department.children" class="root" ng-include src="'/Templates/Department/TreeTemplate.html'">
				</li>
			</ul>
		</div>
	</div>
	<div class="col-sm-8" ng-show="addMode">
		<div class="row">
			<form class="col-sm-11 form-horizontal common-form" name="addPepartment" novalidate>
			<div class="col-sm-offset-2">
				<div class="error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
					{{error}}
				</div>
				<span class="error-message hide-errormessage" id="departmentValid">Please input all
					required (*) fields.</span>
			</div>
			<div class="form-group required">
				<label class="col-sm-2 control-label" data-translate="Code" />
				<div class="col-sm-8">
					<input class="form-control" type="text" ng-model="newNode.code" maxlength="200" placeholder="Department Code"
						required />
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-2 control-label" data-translate="Name" />
				<div class="col-sm-8">
					<input class="form-control" type="text" ng-model="newNode.name" maxlength="200" placeholder="Department Name"
						required />
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-2 control-label" data-translate="Parent Node">
				</label>
				<div class="col-sm-8">
					<select class="form-control" ng-model="selectedNode.departmentId" required>
						<option style="display: none" value="">-- Select a Parent Node --</option>
						<option ng-repeat="dept in departments" value="{{dept.departmentId}}">{{dept.name}}</option>
					</select>
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-2 control-label" data-translate="Manager" />
				<div class="col-sm-8">
					<input class="form-control" type="text" ng-model="searchKey" search-auto-complete
						search-employees="searchEmployees" ng-change="getEmployee(searchKey)" employee="newNode.manager"
						maxlength="200" placeholder="Manager" required id="txtManager" />
				</div>
			</div>
            <div class="form-group">
                <div class="col-sm-offset-2">
				<button class="button" ng-click="addChild(newNode)" data-translate="Submit">
				</button>
				<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
				</button>
			</div>
            </div>
			
			</form>
		</div>
	</div>
	<div class="col-sm-8" ng-show="editMode">
		<div class="row">
			<form class="col-sm-11 form-horizontal common-form" name="editDepartment" novalidate>
			<div class="col-sm-offset-2">
				<div class="error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
					{{error}}
				</div>
				<span class="error-message hide-errormessage" id="Span1">Please input all required (*)
					fields.</span>
			</div>
			<div class="form-group required">
				<label class="col-sm-3 control-label" data-translate="Code" />
				<div class="col-sm-8">
					<input class="form-control" ng-disabled="isDisabled" type="text" ng-model="detailsNode.code"
						maxlength="200" placeholder="Department Code" required />
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-3 control-label" data-translate="Name" />
				<div class="col-sm-8">
					<input class="form-control" ng-disabled="isDisabled" type="text" ng-model="detailsNode.name"
						maxlength="200" placeholder="Department Name" required />
				</div>
			</div>
			<div class="form-group required" ng-show="detailsNode.parentId != null">
				<label class="col-sm-3 control-label" data-translate="Parent Node">
				</label>
				<div class="col-sm-8">
					<select ng-disabled="isDisabled" class="form-control" ng-model="detailsNode.parentId"
						required>
						<option style="display: none" value="">-- Select a Parent Node --</option>
						<option ng-repeat="dept in departments" value="{{dept.departmentId}}" ng-hide="hideChildNode(dept) || dept.departmentId == detailsNode.departmentId">
							{{dept.name}}</option>
					</select>
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-3 control-label" data-translate="Manager" />
				<div class="col-sm-8">
					<input ng-disabled="isDisabled" class="form-control" type="text" ng-model="detailsNode.searchKey"
						search-auto-complete search-employees="searchEmployees" ng-change="getEmployee(detailsNode.searchKey)"
						employee="detailsNode.manager" maxlength="200" placeholder="Manager" />
				</div>
			</div>
			<div class="form-group required">
				<label class="col-sm-3 control-label" data-translate="Is disabled" />
				<div class="col-sm-8">
					<input ng-disabled="isDisabled" type="checkbox" ng-model="detailsNode.isDisabled" />
				</div>
			</div>
			<div class="form-group required" ng-show="isDisabled">
				<label class="col-sm-3 control-label" data-translate="CreatedDate">
				</label>
				<div class="col-sm-8">
					<input ng-disabled="isDisabled" type="text" class="form-control custom-date" ng-model="detailsNode.createdDate"
						is-open="calendar.startDateOpened" placeholder="Start Date" datepicker-popup="{{dateFormat}}"
						id="startDate" readonly required />
				</div>
			</div>
			<div class="form-group" ng-show="isDisabled">
				<label class="col-sm-3 control-label" data-translate="Modified date">
				</label>
				<div class="col-sm-8">
					<input ng-disabled="isDisabled" type="text" class="form-control custom-date" ng-model="detailsNode.modifiedDate"
						is-open="calendar.endDateOpened" placeholder="End Date" datepicker-popup="{{dateFormat}}"
						id="endDate" readonly required />
				</div>
			</div>
			 <div class="form-group">
                <div class="col-sm-offset-3">
				<button class="button" ng-click="toggleEditMode()" data-translate="Edit" ng-show="isDisabled">
				</button>
				<button class="button" ng-click="editChild(detailsNode)" data-translate="Submit"
					ng-show="!isDisabled">
				</button>
				<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
				</button>
			</div>
			</form>
		</div>
	</div>
</div>
