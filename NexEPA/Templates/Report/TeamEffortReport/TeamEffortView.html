<div class="col-sm-12">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li><a href="#" data-translate="Report" ng-click="reload()"></a></li>
			<li class="current" data-translate="TeamEffortReport"></li>
		</ul>
	</div>
	<div class="row row-filter filter-max-width">
		<form novalidate class="form-horizontal common-form col-sm-12 filter">
			<div class="form-group">
				<label class="col-sm-2 control-label text-right" data-translate="From">
				</label>
				<div class="col-sm-2">
					<input class="calendar-form-control" type="text" ng-model="filter.fromDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.startDateOpened" />
					<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
				</div>
				<label class="col-sm-2 control-label text-right" data-translate="To">
				</label>
				<div class="col-sm-2">
					<input class="calendar-form-control" type="text" ng-model="filter.toDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.endDateOpened" />
					<calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label text-right" data-translate="Team">
				</label>
				<div class="col-sm-2">
					<select ng-model="filter.groupId" ng-options="opt.id as opt.name for opt in groups"
						class="form-control" data-ng-change="getEmployee()">
						<option value="" data-translate="All"></option>
					</select>
				</div>
				<label class="col-sm-2 control-label text-right" data-translate="Employee">
				</label>
				<div class="col-sm-2">
					<add-class-to-role-filter multi-select input-model="employees" button-label="employeeId"
						helper-elements="all reset filter" item-label="fullName" tick-property="ticked" max-labels="0"
						class="multi-select">
					</add-class-to-role-filter>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 text-right">
						<input type="radio" ng-model="filter.isFilterGroup" value="false"
							ng-click="filter.isFilterGroup = 'false'" /> Redmine Project
					</label>
				<div class="col-sm-2">
					<add-class-to-role-filter multi-select input-model="projects" button-label="projectId"
							helper-elements="all reset filter" item-label="name" tick-property="ticked"
							on-item-click="fClick()" on-select-all="fSelectAll()" on-reset="fReset()"
							disabled-enabled-multi-select ng-disabled="filter.isFilterGroup"
							max-labels="0" class="multi-select">
					</add-class-to-role-filter>
				</div>
				<label class="col-sm-2 text-right">
					<input type="radio" ng-model="filter.isFilterGroup" value="true"
						ng-click="filter.isFilterGroup = 'true'" /> Group Redmine Project
				</label>
				<div class="col-sm-2">
					<select class="form-control" ng-model="filter.groupProjectId" 
							ng-options="opt.groupProjectId as opt.name for opt in groupProjects"
							ng-change="getEmployee()" ng-disabled="filter.isFilterGroup == 'false'">
						<option value="">{{"All" | translate}}</option>
					</select>
				</div>
				<div class="col-sm-2 text-right">
					<button class="button ladda-button" data-style="slide-up" data-loading-button
						data-is-started="isLoadingButton" data-ng-click="handleReportData()">
						<span class="ladda-label" data-translate="Submit"></span>
					</button>
				</div>
			</div>
		</form>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/TeamEffortReport/TeamEfforts.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/TeamEffortReport/TeamEffortChart.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/TeamEffortReport/MemberEffortChart.html'">
		</div>
	</div>
	<br />
</div>
