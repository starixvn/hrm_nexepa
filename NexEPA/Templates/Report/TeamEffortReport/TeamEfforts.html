<div class="common-form container-content" data-ng-show="teamEfforts.data !== ''">
	<div class="row boxtitle first" data-ng-click="collapseTable('team')">
		<span class="glyphicon glyphicon-th-large" aria-hidden="true"></span>&nbsp;<span
			class="home-label" data-translate="TeamEffortInFigures"></span>
	</div>
	<div class="row" data-collapse="isTeamCollapsed">
		<div class="div-scroll">
			<table class="table table-bordered tbody-striped">
				<thead>
					<tr>
						<th>
							#
						</th>
						<th data-translate="Member">
						</th>
						<th data-translate="Project">
						</th>
						<th data-ng-repeat="month in teamEfforts.yearMonths" data-ng-bind="month.monthName">
						</th>
						<th data-translate="TotalAverage">
						</th>
					</tr>
				</thead>
				<tbody data-ng-repeat="member in teamEfforts.memberProjects">
					<tr data-ng-repeat="project in member.projects">
						<td class="home-index" data-ng-if="$first" data-ng-bind="member.index" rowspan="{{member.projects.length +3}}">
						</td>
						<td data-ng-if="$first" rowspan="{{member.projects.length +3}}">
							<a href tooltip="View chart" data-ng-click="renderPersonalChart(member.employee.nickName,member.employee.fullName)"
								data-ng-bind="member.employee.fullName"></a>
						</td>
						<td data-ng-bind="project.projectName">
						</td>
						<td class="report-right" data-ng-repeat="month in teamEfforts.yearMonths" data-ng-init="spentTimeByMonths[member.employee.nickName+project.projectId.toString()+month.year.toString()+month.month.toString()]=getSpentTimeByMonth(member.employee.nickName,project.projectId,month.year,month.month)"
							data-ng-bind="spentTimeByMonths[member.employee.nickName+project.projectId.toString()+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td data-ng-bind="project.totalSpentTimeOfAllMonths | customNumber" class="report-total">
						</td>
					</tr>
					<tr class="bg-sub-total">
						<td class="report-total-left" data-translate="SubTotal">
						</td>
						<td class="report-total" data-ng-repeat="month in teamEfforts.yearMonths" data-ng-init="subTotalByMonths[member.employee.nickName+month.year.toString()+month.month.toString()]=getSubTotalByMonth(member.employee.nickName,month.year,month.month)"
							data-ng-bind="subTotalByMonths[member.employee.nickName+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td data-ng-init="subTotalSpentTimeByMembers[member.employee.nickName]=getSubTotalSpentTimeByMember(member.employee.nickName)"
						data-ng-bind="subTotalSpentTimeByMembers[member.employee.nickName] | customNumber"
							class="report-total">
						</td>
					</tr>
					<tr class="bg-working-day">
						<td class="report-total-left" data-translate="WorkingDay">
						</td>
						<td class="report-total" data-ng-repeat="month in teamEfforts.yearMonths" 
						data-ng-init="workingDayByMonths[member.employee.nickName+month.year.toString()+month.month.toString()]=getWorkingDayByMonth(member.employee.nickName,month.year,month.month)"
						data-ng-bind="workingDayByMonths[member.employee.nickName+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td class="report-total" data-ng-init="subTotalWorkingDayByMembers[member.employee.nickName]=getSubTotalWorkingDayByMember(member.employee.nickName)"
						data-ng-bind="subTotalWorkingDayByMembers[member.employee.nickName] | customNumber">
						</td>
					</tr>
					<tr class="bg-workload">
						<td class="report-total-left" data-translate="Workload">
						</td>
						<td class="report-total" data-ng-repeat="month in teamEfforts.yearMonths" 
						data-ng-init="workloadByMonths[member.employee.nickName+month.year.toString()+month.month.toString()]=getWorkloadByMonth(member.employee.nickName,month.year,month.month)"
						data-ng-bind="workloadByMonths[member.employee.nickName+month.year.toString()+month.month.toString()] | customPercent:2">
						</td>
						<td class="report-total" 
						data-ng-init="subTotalWorkloadByMembers[member.employee.nickName]=getSubTotalWorkloadByMember(member.employee.nickName)"
						data-ng-bind="subTotalWorkloadByMembers[member.employee.nickName] | customPercent:2">
						</td>
					</tr>
				</tbody>
				<tbody class="bg-total" data-ng-show="teamEfforts.data != ''">
					<tr>
						<td data-translate="TotalAverage" class="report-total-center" colspan="2" rowspan="2">
						</td>
						<td class="report-total-left" data-translate="SpentTime">
						</td>
						<td class="report-total" data-ng-repeat="month in teamEfforts.yearMonths" 
						data-ng-init="totalSpentTimeByMonths[month.year.toString()+month.month.toString()]=getTotalSpentTimeByMonth(month.year,month.month)"
						data-ng-bind="totalSpentTimeByMonths[month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td class="report-total" data-ng-bind="teamEfforts.grandTotalEffort | customNumber">
						</td>
					</tr>
					<tr class="bg-workload">
						<td class="report-total-left" data-translate="Workload">
						</td>
						<td class="report-total" data-ng-repeat="month in teamEfforts.yearMonths" 
						data-ng-init="averageWorkloadByMonths[month.year.toString()+month.month.toString()]=getAverageWorkloadByMonth(month.year,month.month)"
						data-ng-bind="averageWorkloadByMonths[month.year.toString()+month.month.toString()] | customPercent:2">
						</td>
						<td class="report-total" data-ng-bind="teamEfforts.grandAverageWorkload | customPercent:2">
						</td>
					</tr>
				</tbody>
				<tr data-ng-show="teamEfforts.data.length === 0">
					<td class="empty-result" colspan="17" data-translate="EmptyResult">
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>
