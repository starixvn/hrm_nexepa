<div class="col-sm-12 person-report">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li><a href="#" data-translate="Report" data-ng-click="reload()"></a></li>
			<li class="current" data-translate="EmployeePerformanceTendency"></li>
		</ul>
	</div>
	<div class="row row-filter filter-max-width">
		<form data-novalidate class="form-horizontal common-form col-sm-12 filter">
			<div class="form-group">
				<label class="col-sm-2 control-label text-right" data-translate="Employee"></label>
				<div class="col-sm-2">
					<input class="form-control" data-ng-model="filter.searchKey" placeholder="full name or nick name"
						data-ng-change="getEmployee(filter.searchKey)" data-search-auto-complete data-search-key="filter.searchKey"
						data-search-employees="searchEmployees" data-employee="employee" data-ng-readonly="isOnlyMember" />
				</div>
				<label class="col-sm-2 control-label text-right" data-translate="From"></label>
				<div class="col-sm-2 date-box">
					<input type="text" class="form-control" data-datepicker-popup="dd MMM, yyyy" data-ng-model="filter.fromDate"
						data-is-open="fromOpened" data-ng-click="open($event,'from')" />
					<calendar-image class="calendar-image" ng-click="open($event,'to')"></calendar-image>
				</div>
				<label class="col-sm-1 control-label text-right" data-translate="To"></label>
				<div class="col-sm-2 date-box">
					<input type="text" class="form-control" data-datepicker-popup="dd MMM, yyyy" data-ng-model="filter.toDate"
						data-is-open="toOpened" data-ng-click="open($event,'to')" />
					<calendar-image class="calendar-image" ng-click="open($event,'to')"></calendar-image>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 text-right">
					<input type="radio" ng-model="filter.isFilterGroup" value="false" 
						ng-click="filter.isFilterGroup = 'false'" /> Redmine Project
				</label>
				<div class="col-sm-2">
					<add-class-to-role-filter multi-select input-model="projects" button-label="projectId"
						helper-elements="all reset filter" item-label="name" tick-property="ticked" 
						disabled-enabled-multi-select ng-disabled="filter.isFilterGroup"
						max-labels="0" class="multi-select">
					</add-class-to-role-filter>
				</div>
				<label class="col-sm-2 text-right">
					<input type="radio" ng-model="filter.isFilterGroup" value="true" 
						ng-click="filter.isFilterGroup = 'true'" /> Group Redmine Project
				</label>
				<div class="col-sm-2">
					<select class="form-control" ng-model="filter.groupProjectId" ng-disabled="filter.isFilterGroup == 'false'"
							ng-options="opt.groupProjectId as opt.name for opt in groupProjects">
						<option value=""></option>
					</select>
				</div>
				<div class="col-sm-offset-1 col-sm-2">
					<button class="button ladda-button" data-ng-click="getReportData()" data-style="slide-up"
						data-loading-button data-is-started="isLoadingButton">
						<span class="ladda-label" data-translate="Submit"></span>
					</button>
				</div>
			</div>
		</form>
	</div>
	<div class="row filter-max-width">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceTendency/GeneralInformation.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceTendency/HistoryProject.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceTendency/PersonalEffort.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceTendency/PersonalEffortChart.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceTendency/PersonalEffortDetail.html'">
		</div>
	</div>
	<br />
</div>
