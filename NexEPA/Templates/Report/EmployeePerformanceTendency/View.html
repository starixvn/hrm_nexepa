<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Report" ng-click="reload()"></a></li>
            <li class="current" data-translate="EmployeePerformanceTendency"></li>
        </ul>
    </div>

    <div class="form-inline filter">
        <form novalidate class="form-inline">
            <div class="form-group">
                <label data-translate="Employee"></label>
                <input class="form-control" ng-model="search.searchKey" placeholder="full name or nick name" ng-change="getEmployee(search.searchKey)"
                        search-auto-complete search-key="search.searchKey" search-employees="searchEmployees" employee="employee"/>
            </div>
            <button class="button" ng-click="getReport(employee)" ng-disabled="disabledSubmit" data-translate="Submit"></button>
        </form>
    </div>
</div>
