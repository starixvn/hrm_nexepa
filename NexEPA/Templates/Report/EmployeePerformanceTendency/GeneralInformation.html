<div ng-controller="EmployeeGeneralInformationController" ng-show="report.generalInformation != ''">
    <form class="col-sm-8 col-md-6 form-horizontal common-form info-form" role="form">
    <div class="row infoUser">
        <div class="col-xs-4 col-sm-4 text-center left-form">
            <div class="row">
                <div class="img-user">
                    <img class="img-default" src="http://www.gravatar.com/avatar/{{report.generalInformation.gravatar}}" alt="User" title="User">
                </div>
            </div>
            <div class="row text-center">
                <span class="fullName" ng-bind="report.generalInformation.fullName"></span>
            </div>
            <div class="row text-center">
                <span class="domainUserName" ng-bind="report.generalInformation.domainUsername">
                </span>
            </div>
        </div>
        <div class="col-xs-8 col-sm-8 right-form">
            <div class="form-group line no-topBorder">
                <label class="col-xs-4 col-sm-3 control-label" data-translate="StaffId">
                </label>
                <div class="col-xs-8 col-sm-9">
                    <span ng-bind="report.generalInformation.code"></span>
                </div>
            </div>
            <div class="form-group line">
                <label class="col-xs-4 col-sm-3 control-label" data-translate="JobTitle">
                </label>
                <div class="col-xs-8 col-sm-9">
                    <span ng-bind="report.generalInformation.jobTitle.name"></span>
                </div>
            </div>
            <div class="form-group line">
                <label class="col-xs-4 col-sm-3 control-label" data-translate="Team">
                </label>
                <div class="col-xs-8 col-sm-9">
                    <span ng-bind="report.generalInformation.group.name"></span>
                </div>
            </div>
            <div class="form-group line no-bottomBorder">
                <label class="col-xs-4 col-sm-3 control-label" data-translate="Role">
                </label>
                <div class="col-xs-8 col-sm-9">
                    <span ng-bind="report.generalInformation.roles"></span>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
