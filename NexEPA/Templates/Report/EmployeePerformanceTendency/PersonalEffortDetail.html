<div class="common-form container-content" data-ng-show="personalEffortDetails.data !== ''">
	<div class="row boxtitle first" data-ng-click="collapseTable('effortDetail')">
		<span class="glyphicon glyphicon-th-large" aria-hidden="true"></span>&nbsp;<span
			class="home-label" data-ng-bind="effortDetailInFiguresTitle"></span>
	</div>
	<div class="row" data-collapse="isEffortDetailCollapsed">
		<div class="div-scroll">
			<table class="table table-bordered tbody-striped">
				<thead>
					<tr>
						<th rowspan="2">
							#
						</th>
						<th rowspan="2" data-translate="Project">
						</th>
						<th rowspan="2" data-translate="Tracker">
						</th>
						<th data-ng-repeat="month in personalEffortDetails.workloadByMonths" data-ng-bind="month.monthName"
							colspan="2">
						</th>
						<th data-translate="TotalAverage" colspan="2">
						</th>
					</tr>
					<tr>
						<th data-ng-repeat-start="month in personalEffortDetails.workloadByMonths" data-translate="Count">
						</th>
						<th data-ng-repeat-end data-translate="Spent">
						</th>
						<th data-translate="Count">
						</th>
						<th data-translate="Spent">
						</th>
					</tr>
				</thead>
				<tbody data-ng-repeat="project in personalEffortDetails.projectTrackers">
					<tr data-ng-repeat="tracker in project.trackers">
						<td class="home-index" data-ng-if="$first" data-ng-bind="project.index" rowspan="{{project.trackers.length +2}}">
						</td>
						<td data-ng-bind="project.projectName" data-ng-if="$first" rowspan="{{project.trackers.length +2}}">
						</td>
						<td data-ng-bind="tracker.trackerName">
						</td>
						<td class="report-right" data-ng-repeat-start="month in personalEffortDetails.workloadByMonths"
							data-ng-init="detailNumberIssues[project.projectId.toString()+tracker.trackerId.toString()+month.year.toString()+month.month.toString()]=getDetailNumberIssue(project.projectId,tracker.trackerId,month.year,month.month)"
							data-ng-bind="detailNumberIssues[project.projectId.toString()+tracker.trackerId.toString()+month.year.toString()+month.month.toString()]">
						</td>
						<td class="report-right" data-ng-init="detailSpentTimes[project.projectId.toString()+tracker.trackerId.toString()+month.year.toString()+month.month.toString()]=getDetailSpentTime(project.projectId,tracker.trackerId,month.year,month.month)"
							data-ng-repeat-end data-ng-bind="detailSpentTimes[project.projectId.toString()+tracker.trackerId.toString()+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td data-ng-bind="tracker.numberIssue" class="report-total">
						</td>
						<td data-ng-bind="tracker.spentTime | customNumber" class="report-total">
						</td>
					</tr>
					<tr class="bg-sub-total">
						<td data-translate="SubTotal">
						</td>
						<td class="report-right" data-ng-repeat-start="month in personalEffortDetails.workloadByMonths"
							data-ng-init="subTotalIssues[project.projectId.toString()+month.year.toString()+month.month.toString()]=getSubTotalIssue(project.projectId,month.year,month.month)"
							data-ng-bind="subTotalIssues[project.projectId.toString()+month.year.toString()+month.month.toString()]">
						</td>
						<td class="report-right" data-ng-repeat-end data-ng-init="subTotalSpentTimes[project.projectId.toString()+month.year.toString()+month.month.toString()]=getSubTotalSpentTime(project.projectId,month.year,month.month)"
							data-ng-bind="subTotalSpentTimes[project.projectId.toString()+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td data-ng-bind="project.totalNumberIssue" class="report-total">
						</td>
						<td data-ng-bind="project.totalSpentTime | customNumber" class="report-total">
						</td>
					</tr>
					<tr class="bg-workload">
						<td>
							Workload
						</td>
						<td colspan="2" class="report-center" data-ng-repeat="month in personalEffortDetails.workloadByMonths"
							data-ng-init="workloads[project.projectId.toString()+month.year.toString()+month.month.toString()]=getWorkload(project.projectId,month.year,month.month)"
							data-ng-bind="workloads[project.projectId.toString()+month.year.toString()+month.month.toString()] | customPercent:2">
						</td>
						<td colspan="2" class="report-total-center" data-ng-init="sumWorkloads[project.projectId.toString()]=getSumWorkload(project.projectId)"
							data-ng-bind="sumWorkloads[project.projectId.toString()] | customPercent:2">
						</td>
					</tr>
				</tbody>
				<tbody class="bg-total" data-ng-show="personalEffortDetails.data != ''">
					<tr data-ng-repeat="tracker in personalEffortDetails.distinctTrackerMonths">
						<td colspan="2" data-translate="GrandTotal" class="report-total-center" data-ng-if="$first"
							rowspan="{{personalEffortDetails.distinctTrackerMonths.length+3}}">
						</td>
						<td class="report-total-left" data-ng-bind="tracker.trackerName">
						</td>
						<td class="report-total" data-ng-repeat-start="month in personalEffortDetails.workloadByMonths"
							data-ng-init="totalNumberIssues[tracker.trackerId.toString()+month.year.toString()+month.month.toString()]=getTotalNumberIssue(tracker.trackerId,month.year,month.month)"
							data-ng-bind="totalNumberIssues[tracker.trackerId.toString()+month.year.toString()+month.month.toString()]">
						</td>
						<td class="report-total" data-ng-repeat-end data-ng-init="totalSpentTimes[tracker.trackerId.toString()+month.year.toString()+month.month.toString()]=getTotalSpentTime(tracker.trackerId,month.year,month.month)"
							data-ng-bind="totalSpentTimes[tracker.trackerId.toString()+month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td class="report-total" data-ng-bind="tracker.totalNumberIssue">
						</td>
						<td class="report-total" data-ng-bind="tracker.totalSpentTime | customNumber">
						</td>
					</tr>
					<tr class="bg-grand-sub-total">
						<td class="report-total-left" data-translate="Sum">
						</td>
						<td class="report-total" data-ng-repeat-start="month in personalEffortDetails.workloadByMonths"
							data-ng-init="grandSubTotalIssues[month.year.toString()+month.month.toString()]=getGrandSubTotalIssue(month.year,month.month)"
							data-ng-bind="grandSubTotalIssues[month.year.toString()+month.month.toString()]">
						</td>
						<td class="report-total" data-ng-repeat-end data-ng-init="grandSubTotalSpentTimes[month.year.toString()+month.month.toString()]=getGrandSubTotalSpentTime(month.year,month.month)"
							data-ng-bind="grandSubTotalSpentTimes[month.year.toString()+month.month.toString()] | customNumber">
						</td>
						<td data-ng-bind="personalEffortDetails.grandTotalIssueSpent.numberIssue" class="report-total">
						</td>
						<td data-ng-bind="personalEffortDetails.grandTotalIssueSpent.spentTime | customNumber"
							class="report-total">
						</td>
					</tr>
					<tr class="bg-working-day">
						<td class="report-total-left" data-translate="WorkingDay">
						</td>
						<td colspan="2" class="report-total-center" data-ng-repeat="month in personalEffortDetails.workloadByMonths"
							data-ng-bind="month.totalWorkingDay | customNumber">
						</td>
						<td colspan="2" class="report-total-center" data-ng-bind="personalEffortDetails.grandTotalWorkingDay | customNumber">
						</td>
					</tr>
					<tr class="bg-workload">
						<td class="report-total-left">
							Workload
						</td>
						<td colspan="2" class="report-total-center" data-ng-repeat="month in personalEffortDetails.workloadByMonths"
							data-ng-bind="month.workload | customPercent:2">
						</td>
						<td colspan="2" class="report-total-center" data-ng-bind="personalEffortDetails.grandTotalWorkload | customPercent:2">
						</td>
					</tr>
				</tbody>
				<tr data-ng-show="personalEffortDetails.data == ''">
					<td class="empty-result" colspan="31" data-translate="EmptyResult">
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>
