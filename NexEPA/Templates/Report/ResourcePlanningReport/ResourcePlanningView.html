<div class="col-sm-12 resource-planning-report">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li><a href="#" data-translate="Report" data-ng-click="reload()"></a></li>
			<li class="current" data-translate="ResourcePlanningReport"></li>
		</ul>
	</div>
	<div class="row row-filter filter-max-width">
		<form data-novalidate class="form-horizontal common-form col-sm-12 filter">
		<div class="row">
			<div class="col-sm-3 first-filter">
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="From">
					</label>
					<div class="col-sm-8">
						<input class="calendar-form-control" type="text" data-ng-model="filter.fromDate"
							data-datepicker-popup="{{dateFormat}}" data-is-open="calendar.startDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="Project">
					</label>
					<div class="col-sm-8">
						<select data-ng-model="filter.projectId" data-ng-options="opt.id as opt.name for opt in projects"
							class="form-control" data-ng-change="getEmployee()">
							<option value="" data-translate="All"></option>
						</select>
					</div>
				</div>
			</div>
			<div class="col-sm-3">
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="To">
					</label>
					<div class="col-sm-8">
						<input class="calendar-form-control" type="text" data-ng-model="filter.toDate" data-datepicker-popup="{{dateFormat}}"
							data-is-open="calendar.endDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="Employee">
					</label>
					<div class="col-sm-8">
						<add-class-to-role-filter multi-select input-model="employees" button-label="employeeId"
							helper-elements="all reset" item-label="fullName" tick-property="ticked" max-labels="0"
							class="multi-select">
						</add-class-to-role-filter>
					</div>
				</div>
			</div>
			<div class="col-sm-3">
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="Team">
					</label>
					<div class="col-sm-8">
						<select data-ng-model="filter.groupId" data-ng-options="opt.id as opt.name for opt in groups"
							class="form-control" data-ng-change="getEmployee()">
							<option value="" data-translate="All"></option>
						</select>
					</div>
				</div>
				<div class="form-group report-submit">
					<button class="button ladda-button" data-style="slide-up" data-loading-button data-is-started="isLoadingButton"
						data-ng-click="handleReportData()">
						<span class="ladda-label" data-translate="Submit"></span>
					</button>
				</div>
			</div>
		</div>
		</form>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/ResourcePlanningReport/ResourcePlanningDetail.html'">
		</div>
	</div>
	<br />
</div>
