<div class="common-form container-content" data-ng-show="reportData.detailResourcePlannings">
	<div class="row boxtitle first" data-ng-click="collapseTable()">
		<span class="glyphicon glyphicon-th-large" aria-hidden="true"></span>&nbsp;<span
			class="home-label" data-translate="ResourcePlanning"></span>
	</div>
	<div class="row" data-collapse="isCollapsed">
		<div class="div-scroll">
			<table class="table table-bordered">
				<thead>
					<tr>
						<th rowspan="2">
							#
						</th>
						<th rowspan="2" data-translate="Members">
						</th>
						<th rowspan="2" data-translate="Issue Count">
						</th>
						<th data-ng-repeat="month in reportData.monthInfo" data-ng-bind="month.monthName"
							colspan="{{month.dayCount}}">
						</th>
					</tr>
					<tr>
						<th data-ng-repeat="date in reportData.dateInfo" data-ng-bind="date.dateStatus.dayName">
						</th>
					</tr>
				</thead>
				<tbody data-ng-repeat="resource in reportData.projectResources">
					<tr>
						<td class="bg-nick-name home-index" data-ng-bind="$index+1">
						</td>
						<td class="bg-nick-name" data-ng-bind="resource.employee.fullName">
						</td>
						<td class="bg-nick-name report-right" data-ng-bind="resource.totalIssueCount">
						</td>
						<td class="report-center" data-ng-class="getTopLevelWorkingClass(resource.employee.nickName,date.dateStatus.workDate)"
							data-ng-repeat="date in reportData.dateInfo">
							<div>
								&nbsp;<span data-ng-bind="getDateStatus(resource.employee.nickName,date.dateStatus.workDate)">
								</span>
							</div>
						</td>
					</tr>
					<tr data-ng-repeat="project in resource.projects">
						<td>
						</td>
						<td class="project-column" data-ng-bind="project.projectName">
						</td>
						<td class="report-right" data-ng-bind="project.issueCount">
						</td>
						<td class="report-center" data-ng-class="getSubLevelWorkingClass(resource.employee.nickName,project.projectId,date.dateStatus.workDate)"
							data-ng-repeat="date in reportData.dateInfo">
							<div>
								&nbsp;
							</div>
						</td>
					</tr>
				</tbody>
				<tr data-ng-show="reportData.detailResourcePlannings.length === 0">
					<td class="empty-result" colspan="31" data-translate="EmptyResult">
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>
