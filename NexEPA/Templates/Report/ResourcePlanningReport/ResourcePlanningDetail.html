<div class="common-form container-content" data-ng-show="reportData.detailResourcePlannings!=null">
	<div class="row boxtitle first" data-ng-click="collapseTable()">
		<span class="glyphicon glyphicon-th-large" aria-hidden="true"></span>&nbsp;<span
			class="home-label" data-translate="ResourcePlanning"></span>
	</div>
	<div class="row" data-collapse="isCollapsed">
		<div class="div-scroll">
			<table class="table table-bordered">
				<thead>
					<tr>
						<th rowspan="2">
							#
						</th>
						<th rowspan="2" data-translate="Members">
						</th>
						<th rowspan="2" data-translate="Issue Count">
						</th>
						<th data-ng-repeat="month in reportData.monthInfo" data-ng-bind="month.monthName"
							colspan="{{month.dayCount}}">
						</th>
					</tr>
					<tr>
						<th data-ng-repeat="date in reportData.dateInfo" data-ng-bind="date.dateStatus.dayName">
						</th>
					</tr>
				</thead>
				<tbody data-ng-repeat-start="resource in reportData.projectResources">
					<tr>
						<td class="bg-nick-name home-index" data-ng-bind="$index+1">
						</td>
						<td class="bg-nick-name">
							<div class="pull-left" data-ng-class="collapses[resource.employee.fullName]?'expand-icon':'collapse-icon'"
								data-ng-click="collapses[resource.employee.fullName]=!collapses[resource.employee.fullName]">
							</div><a href data-ng-bind="resource.employee.fullName" data-ng-click="collapses[resource.employee.fullName]=!collapses[resource.employee.fullName]">
							</a>
						</td>
						<td class="bg-nick-name report-right" data-ng-bind="resource.totalIssueCount">
						</td>
						<td class="report-center" data-ng-init="topLevelWorkingClasses[resource.employee.nickName+date.dateStatus.workDate.valueOf()]=getTopLevelWorkingClass(resource.employee.nickName,date.dateStatus.workDate)"
							data-ng-class="topLevelWorkingClasses[resource.employee.nickName+date.dateStatus.workDate.valueOf()]"
							data-ng-repeat="date in reportData.dateInfo">
							<div>
								&nbsp;<span data-ng-init="dateStatuses[resource.employee.nickName+date.dateStatus.workDate.valueOf()]=getDateStatus(resource.employee.nickName,date.dateStatus.workDate)"
									data-ng-bind="dateStatuses[resource.employee.nickName+date.dateStatus.workDate.valueOf()]">
								</span>
							</div>
						</td>
					</tr>
				</tbody>
				<tbody data-ng-repeat-end data-ng-init="collapses[resource.employee.fullName]=true"
					data-collapse="collapses[resource.employee.fullName]">
					<tr data-ng-repeat="project in resource.projects">
						<td class="">
						</td>
						<td class="project-column" data-ng-bind="project.projectName">
						</td>
						<td class="report-right" data-ng-bind="project.issueCount">
						</td>
						<td class="report-center" data-ng-init="subLevelWorkingClasses[resource.employee.nickName+project.projectId.toString()+date.dateStatus.workDate.valueOf()]=getSubLevelWorkingClass(resource.employee.nickName,project.projectId,date.dateStatus.workDate)"
							data-ng-class="subLevelWorkingClasses[resource.employee.nickName+project.projectId.toString()+date.dateStatus.workDate.valueOf()]"
							data-ng-repeat="date in reportData.dateInfo">
							<div>
								&nbsp;
							</div>
						</td>
					</tr>
				</tbody>
				<tr data-ng-show="reportData.detailResourcePlannings.length === 0">
					<td class="empty-result" colspan="31" data-translate="EmptyResult">
					</td>
				</tr>
			</table>
		</div>
</div>
</div>
