<div class="row sub-header">
    <ul class="breadcrumb list-inline pull-left">
        <li><a href="#" data-translate="Report" ng-click="reload()"></a></li>
        <li class="current" data-translate="EmployeePerformanceByTeam"></li>
    </ul>
</div>
<div class="row">
	<form novalidate class="form-horizontal common-form col-sm-10 filter">
		<div class="row">
			<div class="col-sm-3">
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="From" >
					</label>
					<div class="col-sm-9">
						<input class="calendar-form-control" type="text" ng-model="filter.fromDate" datepicker-popup="{{dateFormat}}"
							is-open="calendar.startDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="To">
					</label>
					<div class="col-sm-9">
						<input class="calendar-form-control" type="text" ng-model="filter.toDate" datepicker-popup="{{dateFormat}}"
							is-open="calendar.endDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
					</div>
				</div>
			</div>
			<div class="col-sm-4">
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="Team">
					</label>
					<div class="col-sm-8" >
						<select ng-model="filter.groupId" ng-options="opt.id as opt.name for opt in groupOptions"
							class="form-control">
							<option value="" data-translate="AllTeam"></option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="Project">
					</label>
					<div class="col-sm-8">
						<select ng-model="filter.projectId" ng-options="opt.id as opt.name for opt in projectOptions"
							class="form-control" >
							<option value="">-- All --</option>
						</select>
					</div>
				</div>
			</div>
			<div class="col-sm-4">
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="Employee">
					</label>
					<div class="col-sm-8" >
						<input class="form-control" ng-model="search.searchKey" placeholder="full name or nick name"
							ng-change="getEmployee(search.searchKey)" search-auto-complete search-key="search.searchKey"
							search-employees="searchEmployees" employee="employee" />
					</div>
				</div>
				<div class="form-group team-report-submit">
					<button class="button" ng-click="getReport(filter)" ng-disabled="disabledSubmit"
						data-translate="Submit">
					</button>
				</div>
			</div>
		</div>
	</form>
</div>
<div class="row common-form container-content">
    <div class="row boxtitle first" ng-click="collapseTable()">
        <span class="home-label" data-translate="ByProject"></span>
    </div>
    <div class="row " collapse="isCollapsed">
        <table class="table table-bordered table-striped home-table">
            <thead>
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="TeamMember">
                </th>
                <th data-translate="Team">
                </th>
                <th data-translate="ProjectCount">
                </th>
                <th data-translate="EPACount">
                </th>
                <th data-translate="JoinedDate">
                </th>
                <th data-translate="AverageScore">
                </th>
            </thead>
            <tr ng-repeat="employee in reportByProject">
                <td class="home-index" ng-bind="$index + 1">
                </td>
                <td>
                    <a ng-bind="employee.nickName + ' - ' + employee.fullName" href="" ng-click="viewEmployeeTendency(employee.employeeId)"
                        ng-href="{{viewEmployeeTendencyUrl}}" />
                </td>
                <td ng-bind="employee.group.name">
                </td>
                <td class="report-project-count" ng-bind="employee.projectCount">
                </td>
                <td class="report-epa-count" ng-bind="employee.epaCount">
                </td>
                <td class="report-joined-date" ng-bind="employee.joinedDate | customDate">
                </td>
                <td class="report-average-score" ng-bind="employee.averageScore | customNumber">
                </td>
            </tr>
            <tr ng-show="reportByProject == ''">
                <td class="empty-result" colspan="7" data-translate="EmptyResult">
                </td>
            </tr>
        </table>
    </div>
</div>
