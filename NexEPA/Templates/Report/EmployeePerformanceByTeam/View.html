<div class="col-sm-12 team-report">
	<div class="row sub-header">
		<ul class="breadcrumb list-inline pull-left">
			<li><a href="#" data-translate="Report" ng-click="reload()"></a></li>
			<li class="current" data-translate="EmployeePerformanceByTeam"></li>
		</ul>
	</div>
	<div class="row row-filter filter-max-width">
		<form novalidate class="form-horizontal common-form col-sm-12 filter">
		<div class="row">
			<div class="col-sm-3 first-filter">
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="From">
					</label>
					<div class="col-sm-9">
						<input class="calendar-form-control" type="text" ng-model="filter.fromDate" datepicker-popup="{{dateFormat}}"
							is-open="calendar.startDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupStartDate($event)"></calendar-image>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="To">
					</label>
					<div class="col-sm-9">
						<input class="calendar-form-control" type="text" ng-model="filter.toDate" datepicker-popup="{{dateFormat}}"
							is-open="calendar.endDateOpened" />
						<calendar-image class="calendar-image" ng-click="openPopupEndDate($event)"></calendar-image>
					</div>
				</div>
			</div>
			<div class="col-sm-3">
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="Team">
					</label>
					<div class="col-sm-8">
						<select ng-model="filter.groupId" ng-options="opt.id as opt.name for opt in groups"
							class="form-control" data-ng-change="getEmployee()">
							<option value="" data-translate="None"></option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-2 control-label" data-translate="Project">
					</label>
					<div class="col-sm-8">
						<select ng-model="filter.projectId" ng-options="opt.id as opt.name for opt in projects"
							class="form-control" data-ng-change="getEmployee()">
							<option value="" data-translate="None"></option>
						</select>
					</div>
				</div>
			</div>
			<div class="col-sm-3">
				<div class="form-group">
					<label class="col-sm-3 control-label" data-translate="Employee">
					</label>
					<div class="col-sm-8">
						<add-class-to-role-filter multi-select input-model="employees" button-label="employeeId"
							helper-elements="all reset" item-label="fullName" tick-property="ticked" max-labels="0"
							class="multi-select">
						</add-class-to-role-filter>
					</div>
				</div>
				<div class="form-group team-report-submit">
					<button class="button" ng-click="getReportData()" ng-disabled="disabledSubmit" data-translate="Submit">
					</button>
				</div>
			</div>
		</div>
		</form>
	</div>
	<div class="row filter-max-width">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceByTeam/TeamByProjects.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceByTeam/TeamEfforts.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceByTeam/TeamEffortChart.html'">
		</div>
	</div>
	<div class="row">
		<div ng-include data-src="'/Templates/Report/EmployeePerformanceByTeam/PersonalEffortChart.html'">
		</div>
	</div>
	<br />
</div>
