<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="EPA" ng-click="reload()"></a></li>
            <li class="current" data-translate="ManageMyEPA"></li>
        </ul>
    </div>

    <div class="form-inline filter">
        <form novalidate class="form-inline">
            <div class="form-group">
                <label data-translate="Project"></label>
                <select ng-model="filter.projectId" 
                    ng-options="opt.projectId as opt.name for opt in projectOptions" class="form-control">
                    <option value="">-- All --</option>
                 </select>
            </div>
            <button class="button" ng-click="query(filter)" ng-disabled="submitted" data-translate="Submit"></button>
            <div class="error" ng-show="hasError" ng-bind="errorMessage"></div>
        </form>
    </div>
</div>

<div class="row">
    <table class="table table-bordered table-striped">
        <thead>
            <th data-translate="SymbolCount"></th>
            <th data-translate="Project"></th>
            <th data-translate="Milestone"></th>
            <th data-translate="Target"></th>
            <th data-translate="Score"></th>
            <th data-translate="Status"></th>
            <th data-translate="EvaluatorTitle"></th>
            <th data-translate="EvaluateDate"></th>
        </thead>
        <tr ng-repeat="epaItem in listEPA">
            <td class="epa-index" ng-bind="$index + 1"></td>
            <td ng-bind="epaItem.project.projectName"></td>
            <td ng-bind="epaItem.milestone.milestoneName"></td>
            <td ng-bind="epaItem.target.targetName"></td>
            <td class="epa-score">
                <a href="" ng-bind="epaItem.score" ng-click="EPADetail(epaItem)"/>
            </td>
            <td class="epa-status" ng-bind="epaItem.statusName"></td>
            <td ng-bind="epaItem.evaluator.evaluatorFullName"></td>
            <td class="epa-evaluate-date">{{epaItem.evaluateDate | date: 'dd MMM, yyyy'}}</td>
        </tr>

        <tr ng-show="listEPA == ''">
            <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
        </tr>
    </table>
</div>
