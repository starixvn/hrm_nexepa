<div ng-if="data.isReadOnly == 1">
    <input type="checkbox" class="host-only-read"/>
</div>
<div class="align-center" ng-if="data.isReadOnly == 0" >
    <input id="funcHost{{data.functionId}}" name="funcHost" pid="{{data.parentFunctionId}}" 
            value="{{data.functionId}}" ng-model="data.isHost" assign-permission type="checkbox" />
</div>
<div class="child-check-box" ng-repeat="data in data.childFunctions" 
     ng-include src="'/Templates/Authority/TreeHostCheckbox.html'">
</div>
