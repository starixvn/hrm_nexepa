<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Authority" ng-click="reload()"></a></li>
            <li class="current" data-translate="AssignPermissionToRole"></li>
        </ul>
    </div>

    <div class="form-inline filter">
        <form novalidate class="form-inline">
            <div class="form-group">
                <label data-translate="Role"></label>
                <select ng-model="filter.roleId" 
                    ng-options="opt.roleId as opt.name for opt in roleOptions" required class="form-control">
                    </select>
            </div>
            <button class="button" ng-click="query(filter.roleId)" ng-disabled="submitted" data-translate="Submit"></button>
        </form>
    </div>
</div>

<div class="row">
    <table class="table table-bordered target-member-table">
        <thead>
            <tr>
                <th data-translate="Function" rowspan="2"></th>
                <th data-translate="RolePermission" colspan="2"></th>
            </tr>
            <tr>
                <th data-translate="Read"></th>
                <th data-translate="Host"></th>
            </tr>
        </thead>
        <tr ng-repeat="data in functionGroup">
            <td ng-include="'tree_item.html'"></td>
            <td ng-include="'tree_read_checkbox.html'"></td>
            <td ng-include="'tree_host_checkbox.html'"></td>
        </tr>
    </table>
</div>

<script type="text/ng-template" id="tree_item.html">
    <div>{{data.name}}</div>
    <div style="padding-left: 30px; padding-top:10px;" ng-repeat="data in data.childFunctions" ng-include="'tree_item.html'">
    </div>
</script>

<script type="text/ng-template" id="tree_read_checkbox.html">
    <div style="text-align:center;">
        <input type="checkbox" ng-bind="data.isRead" ng-check="data.isRead == 1"/>
    </div>
    <div style="padding-top:8px; text-align:center;" ng-repeat="data in data.childFunctions" ng-include="'tree_read_checkbox.html'">
    </div>
</script>

<script type="text/ng-template" id="tree_host_checkbox.html">
    <div ng-show="data.isReadOnly">
        <input type="checkbox" ng-bind="data.isRead" ng-check="data.isRead == 1" style="text-align:center;visibility:hidden;"/>
    </div>
    <div style="text-align:center;">
        <input ng-show="!data.isReadOnly" type="checkbox" ng-bind="data.isHost" ng-check="data.isHost == 1" />
    </div>
    <div style="padding-top:8px; text-align:center;" ng-repeat="data in data.childFunctions" ng-include="'tree_host_checkbox.html'">
    </div>
</script>
