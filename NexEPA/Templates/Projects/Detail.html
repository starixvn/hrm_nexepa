<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="" data-translate="Project" ng-click="cancel()"></a></li>
            <li class="current" data-translate="ProjectDetail"></li>
        </ul>
        <div class="button-icon">
            <span class="icon plus"></span><a href="" data-translate="EditProject" ng-click="editProject()">
            </a>
        </div>
    </div>
</div>

<div class="row">
    <tabset class="top-buffer" id="projectInfoTab">
	    <tab heading="GENERAL INFORMATION" class="tab-cursor" active="dataTab.information">
		    <form class="row common-form project-form" name="addProjectForm" novalidate>
			    <div class="row boxtitle first" data-translate="ProjectInformation">
			    </div>
			    <div class="row boxcontent information">
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="ProjectName" />
					    <div class="col-sm-6 col-md-4">
						    <input class="custom-textbox" type="text" name="projectname" ng-model="projectUpdate.name"
							    maxlength="200" placeholder="Project Name" disabled/>
					    </div>
				    </div>
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="StartDate">
					    </label>
					    <div class="col-sm-6 col-md-4">
						    <input type="text" class="custom-textbox custom-date" ng-model="projectUpdate.startDate"
							 datepicker-popup="{{dateFormat}}" id="startDate" readonly disabled/>
					    </div>
				    </div>
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="EndDate">
					    </label>
					    <div class="col-sm-6 col-md-4">
						    <input type="text" class="custom-textbox custom-date" ng-model="projectUpdate.endDate"
							 datepicker-popup="{{dateFormat}}" id="endDate" readonly disabled/>
					    </div>
				    </div>
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="PM">
					    </label>
					    <div class="col-sm-6 col-md-4">
						    <select class="custom-textbox" ng-options="pm.employeeId as pm.fullName for pm in pms"
							    ng-model="projectUpdate.projectManager" disabled>
						    </select>
					    </div>
				    </div>
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="Status">
					    </label>
					    <div class="col-sm-6 col-md-4">
						    <select class="custom-textbox" disabled ng-options="s.id as s.name for s in status" ng-model="projectUpdate.status">
						    </select>
					    </div>
				    </div>
				    <div class="col-sm-12 line">
					    <label class="col-sm-2 col-md-2" data-translate="Description">
					    </label>
					    <div class="col-sm-6 col-md-4">
						    <textarea class="custom-textarea" disabled ng-model="projectUpdate.description" maxlength="500"></textarea>
					    </div>
				    </div>
			    </div>
			    <div class="row boxtitle" data-translate="ProjectMilestone">
			    </div>
			    <div class="row boxcontent">
				    <div class="line">
					    <div ng-include src="'/Templates/Projects/ProjectMilestone.html'">
					    </div>
				    </div>
			    </div>
		    </form>
	    </tab>

	    <tab heading="PROJECT MEMBERS" class="tab-cursor" active="dataTab.member">
		    <form class="row common-form project-form" name="projectMember" novalidate>
			    <div class="row boxtitle" data-translate="ProjectMember"></div>
			    <div class="row boxcontent">
				    <div class="line">
					    <div ng-include src="'/Templates/ProjectMembers/Index.html'">
					    </div>
				    </div>
			    </div>
		    </form>
	    </tab>

    </tabset>
</div>
