<div class="row sub-header">
	<ul class="col-xs-12 breadcrumb list-inline pull-left">
		<li>
			<a href="/Projects/Index" data-translate="Project"></a></li>
		<li class="current" data-translate="AddProject"></li>
	</ul>
</div>
<div class="row">
	<form class="col-sm-6 form-horizontal common-form" name="addProjectForm" novalidate>
	<div class="col-sm-offset-3">
		<div class="error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
			{{error}}
		</div>
		<span class="error-message hide-errormessage" id="projectValid">Please input all required
			(*) fields.</span>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label" data-translate="ProjectName" />
		<div class="col-sm-8">
			<input class="form-control" type="text" name="projectname" ng-model="project.name"
				maxlength="200" placeholder="Project Name" required />
		</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label" data-translate="StartDate">
		</label>
		<div class="col-sm-8">
			<input type="text" class="custom-textbox custom-date" ng-model="project.startDate"
				is-open="calendar.startDateOpened" placeholder="Start Date" datepicker-popup="{{dateFormat}}"
				id="startDate" readonly required />
			<calendar-image ng-click="openPopupStartDate($event)"></calendar-image>
		</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label" data-translate="EndDate">
		</label>
		<div class="col-sm-8">
			<input type="text" class="custom-textbox custom-date" ng-model="project.endDate"
				is-open="calendar.endDateOpened" placeholder="End Date" datepicker-popup="{{dateFormat}}"
				id="endDate" readonly required />
			<calendar-image ng-click="openPopupEndDate($event)"></calendar-image>
		</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label" data-translate="PM">
		</label>
		<div class="col-sm-8">
			<select class="form-control" ng-options="pm.employeeId as pm.fullName for pm in pms"
				ng-model="project.projectManager" required>
				<option style="display: none" value="">-- Select a Project Manager --</option>
			</select>
		</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label" data-translate="Status">
		</label>
		<div class="col-sm-8">
			<select class="form-control" ng-options="s.id as s.name for s in status" ng-model="project.status"
				required>
				<option style="display: none" value="">-- Select a status --</option>
			</select>
		</div>
	</div>
	<div class="form-group">
		<label class="col-sm-3 control-label" data-translate="Description">
		</label>
		<div class="col-sm-8">
			<textarea class="form-control" ng-model="project.description" maxlength="500"></textarea>
		</div>
	</div>
	<div class="col-sm-offset-5">
		<button class="button" ng-click="save(project)" data-translate="Submit">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
	</form>
</div>
