<form class="form-horizontal" name="addProjectForm" novalidate">
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10" style="color: red;" ng-show="errors.length > 0"
        ng-repeat="error in errors">
        {{error}}
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{"ProjectName" | translate}} (*)</label>
    <div class="col-sm-4">
        <input type="text" name="projectname" ng-model="project.name" class="form-control"
            placeholder="Project Name" required />
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{"StartDate" | translate}} (*)</label>
    <div class="col-sm-2">
        <input type="text" class="form-control" ng-model="project.startDate" placeholder="Start Date"
            datepicker-popup="dd-MMMM-yyyy" dateFix id="startDate" readonly required />
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{"EndDate" | translate}} (*)</label>
    <div class="col-sm-2">
        <input type="text" class="form-control" ng-model="project.endDate" placeholder="End Date" 
            datepicker-popup="dd-MMMM-yyyy" id="endDate" readonly required />
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{"PM" | translate}} (*)</label>
    <div class="col-sm-4">
        <select class="form-control" ng-options="pm.employeeId as pm.fullName for pm in pms"
            ng-model="project.projectManager" required>
            <option style="display: none" value="">-- Select a Project Manager --</option>
        </select>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{"Status" | translate}} (*)</label>
    <div class="col-sm-4">
        <select class="form-control" ng-options="s.id as s.name for s in status" ng-model="project.status"
            required>
            <option style="display: none" value="">-- Select a status --</option>
        </select>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label" data-translate="Description"></label>
    <div class="col-sm-4">
        <textarea class="form-control" ng-model="project.description"></textarea>
    </div>
</div>
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" ng-disabled="addProjectForm.$invalid" ng-click="save(project)" data-translate="Submit"></button>
        <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel"></button>
    </div>
</div>
</form>
