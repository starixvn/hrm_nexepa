<div ng-controller="CreateProjectController as createProjectCtrl">
    <div class="row">
        <div class="row sub-header">
            <ul class="breadcrumb list-inline pull-left">
                <li>
                    <a href="/Projects/Index" data-translate="Project"></a>
                </li>
                <li class="current" data-translate="AddProject"></li>
            </ul>
            <div class="row action-button">
                <button class="button" ng-click="createProjectCtrl.add()"
                        data-translate="Save" ng-if="!createProjectCtrl.formReadOnly"></button>
            </div>
        </div>
    </div>
    <div class="row target-tabset add-project">
        <tabset id="projectInfoTab">
            <tab heading="GENERAL INFORMATION" class="tab-cursor" active="createProjectCtrl.dataTab.information" select="createProjectCtrl.tabInfoSelect()">
                <form class="row common-form project-form" name="projectForm" novalidate>
                    <div class="row boxtitle first" data-translate="ProjectInformation">
                    </div>
                    <div class="row boxcontent information">
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="ProjectRedmineName" />
                            <div class="col-sm-6 col-md-4">
                                <input class="custom-textbox" type="text" ng-change="createProjectCtrl.getProjects()"
                                       ng-model="createProjectCtrl.searchKey" maxlength="200" placeholder="Project Redmine Name"
                                       required pm-list="createProjectCtrl.getPMByProject"
                                       search-project-auto-complete
                                       search-key="createProjectCtrl.searchKey"
                                       search-projects="createProjectCtrl.searchProjects"
                                       project="createProjectCtrl.project"
                                       project-members="createProjectCtrl.getGroupedMembersByProject"
                                       ng-disabled="createProjectCtrl.formReadOnly" />
                                <input type="hidden" ng-model="createProjectCtrl.project.redmineProjectId" name="redmineProjectId" required />
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="ProjectName" />
                            <div class="col-sm-6 col-md-4">
                                <input class="custom-textbox" type="text" name="projectName" ng-model="createProjectCtrl.project.name"
                                       ng-disabled="createProjectCtrl.formReadOnly" maxlength="200" placeholder="Project Name" />
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="StartDate">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <input type="text" class="custom-textbox custom-date" ng-model="createProjectCtrl.project.startDate"
                                       is-open="createProjectCtrl.calendar.startDateOpened" datepicker-popup="{{createProjectCtrl.dateFormat}}" placeholder="Start Date"
                                       id="startDate" name="startDate" readonly ng-disabled="createProjectCtrl.createProjectCtrl.formReadOnly" />
                                <calendar-image ng-click="createProjectCtrl.openPopupStartDate($event)" ng-hide="createProjectCtrl.createProjectCtrl.formReadOnly"></calendar-image>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="EndDate">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <input type="text" class="custom-textbox custom-date" ng-model="createProjectCtrl.project.endDate"
                                       is-open="createProjectCtrl.calendar.endDateOpened" placeholder="End Date" datepicker-popup="{{createProjectCtrl.dateFormat}}"
                                       id="endDate" readonly ng-disabled="createProjectCtrl.createProjectCtrl.formReadOnly" />
                                <calendar-image ng-click="createProjectCtrl.openPopupEndDate($event)" ng-hide="createProjectCtrl.createProjectCtrl.formReadOnly"></calendar-image>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="PM">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <select class="custom-textbox" name="projectManager" ng-model="createProjectCtrl.project.projectManager" ng-disabled="createProjectCtrl.formReadOnly">
                                    <option ng-repeat="pm in createProjectCtrl.pms" value="{{pm.employeeId}}">{{pm.nickName}} ({{pm.fullName}})</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="Status">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <select class="custom-textbox" ng-options="s.id as s.name for s in createProjectCtrl.status" name="status"
                                        ng-model="createProjectCtrl.project.status" ng-disabled="createProjectCtrl.formReadOnly">
                                    <option style="display: none" value="">-- Select a status --</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="Description">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <textarea class="custom-textarea" ng-model="createProjectCtrl.project.description"
                                          ng-disabled="createProjectCtrl.formReadOnly" maxlength="500"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </tab>

            <tab heading="PROJECT MEMBERS" class="tab-cursor" active="createProjectCtrl.dataTab.member" select="createProjectCtrl.tabMemberSelect()">
                <div ng-include src="'/Templates/ProjectMembers/Index.html'">
                </div>
            </tab>

        </tabset>
    </div>
</div>
