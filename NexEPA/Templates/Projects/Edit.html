<div class="row sub-header">
    <ul class="breadcrumb list-inline pull-left">
        <li><a href="/Projects/Index">Project</a></li>
        <li class="current">Edit Project - {{projectUpdate.name}}</li>
    </ul>
</div>
<div class="row">
    <form class="col-sm-12 form-horizontal common-form" name="addProjectForm" novalidate>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10" style="color: red;" ng-show="errors.length > 0"
            ng-repeat="error in errors">
            {{error}}
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="ProjectName">
        </label>
        <div class="col-sm-4">
            <input type="text" name="projectname" ng-model="projectUpdate.name" class="form-control"
                placeholder="Project Name" readonly />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="StartDate">
        </label>
        <div class="col-sm-4">
            <input type="text" class="form-control" ng-model="projectUpdate.startDate" placeholder="Start Date"
                datepicker-popup="dd-MMMM-yyyy" id="startDate" readonly />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="EndDate">
        </label>
        <div class="col-sm-4">
            <input type="text" class="form-control" ng-model="projectUpdate.endDate" placeholder="End Date"
                datepicker-popup="dd-MMMM-yyyy" id="endDate" readonly />
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="PM">
        </label>
        <div class="col-sm-4">
            <select class="form-control" ng-options="pm.employeeId as pm.fullName for pm in pms"
                ng-model="projectUpdate.projectManager">
                <option style="display: none" value="">-- Select a Project Manager --</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="Status">
        </label>
        <div class="col-sm-4">
            <select class="form-control" ng-options="s.id as s.name for s in status" ng-model="projectUpdate.status">
                <option style="display: none" value="">-- Select a status --</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" data-translate="Description">
        </label>
        <div class="col-sm-4">
            <textarea class="form-control" ng-model="projectUpdate.description"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label" for="exampleInputPassword1" data-translate="Milestone">
        </label>
        <div class="col-sm-12" ng-include src="'/Templates/Projects/ProjectMilestone.html'">
        </div>
    </div>
    <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-primary" ng-disable="addProjectForm.$invalid" ng-click="update(projectUpdate)"
                data-translate="Submit">
            </button>
            <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel">
            </button>
        </div>
    </div>
    </form>
</div>
