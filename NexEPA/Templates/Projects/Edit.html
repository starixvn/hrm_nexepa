<div class="row">
<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="/Projects/Index" data-translate="Project"></a>
		</li>
		<li class="current" data-translate="EditProject"></li>
	</ul>
	<a class="button-icon" ng-if="projectUpdate.permission == 2 && formReadOnly && permissionProject.policy == 2" href="/Projects/Edit/{{projectUpdate.projectId}}">
		<span class="glyphicon glyphicon-edit icon-edit"></span>
		<span class="button-text" data-translate="EditProject"></span>
	</a>
</div>
</div>
<div class="row target-tabset">
	<tabset id="projectInfoTab">
    <tab heading="GENERAL INFORMATION" class="tab-cursor" active="dataTab.information" select="tabInfoSelect()">
        <form class="row common-form project-form" name="addProjectForm" novalidate>
            <div class="row boxtitle first" data-translate="ProjectInformation">
            </div>
            <div class="row boxcontent information">
                <div class="col-sm-offset-2">
                    <div class="error-message buffer-error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
                        {{error}}
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="ProjectName" />
                    <div class="col-sm-6 col-md-4">
                        <input class="custom-textbox" type="text" name="projectname" ng-model="projectUpdate.name"
                           ng-disabled="formReadOnly || permissionProject.policy == 1" maxlength="200" placeholder="Project Name" />
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="StartDate">
                    </label>
                    <div class="col-sm-6 col-md-4">
                        <input type="text" class="custom-textbox custom-date" ng-model="projectUpdate.startDate"
                            is-open="calendar.startDateOpened" datepicker-popup="{{dateFormat}}" placeholder="Start Date"
                            id="startDate" readonly ng-disabled="formReadOnly || permissionProject.policy == 1"/>
                        <calendar-image ng-click="openPopupStartDate($event)" ng-hide="formReadOnly || permissionProject.policy == 1"></calendar-image>
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="EndDate">
                    </label>
                    <div class="col-sm-6 col-md-4">
                        <input type="text" class="custom-textbox custom-date" ng-model="projectUpdate.endDate"
                            is-open="calendar.endDateOpened" placeholder="End Date" datepicker-popup="{{dateFormat}}"
                            id="endDate" readonly ng-disabled="formReadOnly || permissionProject.policy == 1"/>
                            <calendar-image ng-click="openPopupEndDate($event)" ng-hide="formReadOnly || permissionProject.policy == 1"></calendar-image>
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="PM">
                    </label>
                    <div class="col-sm-6 col-md-4">
                        <select class="custom-textbox" ng-model="projectUpdate.projectManager" ng-disabled="formReadOnly || permissionProject.policy == 1">
							<option ng-repeat="pm in pms" value="{{pm.employeeId}}">{{pm.nickName}} ({{pm.fullName}})</option>
                        </select>
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="Status">
                    </label>
                    <div class="col-sm-6 col-md-4">
                        <select class="custom-textbox" ng-options="s.id as s.name for s in status"
						ng-model="projectUpdate.status" ng-disabled="formReadOnly || permissionProject.policy == 1">
                            <option style="display: none" value="">-- Select a status --</option>
                        </select>
                    </div>
                </div>
                <div class="col-sm-12 line">
                    <label class="col-sm-2 col-md-2" data-translate="Description">
                    </label>
                    <div class="col-sm-6 col-md-4">
                        <textarea class="custom-textarea" ng-model="projectUpdate.description" 
						ng-disabled="formReadOnly || permissionProject.policy == 1" maxlength="500"></textarea>
                    </div>
                </div>
            </div>
            <div class="row boxtitle" data-translate="ProjectMilestone">
            </div>
            <div class="row boxcontent">
                <div class="line">
                    <div ng-include src="'/Templates/Projects/ProjectMilestone.html'">
                    </div>
                </div>
            </div>

            <div class="row action-button">
                <button class="button" ng-disabled="addProjectForm.$invalid" ng-click="update(projectUpdate)"
                    data-translate="Submit" ng-if="!formReadOnly && permissionProject.policy == 2">
                </button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
                </button>
            </div>
        </form>
    </tab>

    <tab heading="PROJECT MEMBERS" class="tab-cursor" active="dataTab.member" select="tabMemberSelect()">
        <div ng-include src="'/Templates/ProjectMembers/Index.html'">
        </div>
    </tab>

</tabset>
</div>
