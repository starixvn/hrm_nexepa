<div ng-controller="EditProjectController as editProjectCtrl">
    <div class="row">
        <div class="row sub-header">
            <ul class="breadcrumb list-inline pull-left">
                <li>
                    <a href="/Projects/Index" data-translate="Project"></a>
                </li>
                <li class="current" data-translate="EditProject"></li>
            </ul>
            <div class="row action-button">
                <button class="button" ng-click="editProjectCtrl.update()"
                        data-translate="Save" ng-if="!editProjectCtrl.formReadOnly"></button>
            </div>
        </div>
    </div>
    <div class="row target-tabset">
        <tabset id="projectInfoTab">
            <tab heading="GENERAL INFORMATION" class="tab-cursor" active="editProjectCtrl.dataTab.information" select="editProjectCtrl.tabInfoSelect()">
                <form class="row common-form project-form" name="projectForm" novalidate>
                    <div class="row boxtitle first" data-translate="ProjectInformation">
                    </div>
                    <div class="row boxcontent information">
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="ProjectRedmineName" />
                            <div class="col-sm-6 col-md-4">
                                <input class="custom-textbox" type="text" ng-change="editProjectCtrl.getProjects()"
                                       ng-model="editProjectCtrl.searchKey" maxlength="200" placeholder="Project Redmine Name"
                                       required pm-list="editProjectCtrl.getPMByProject"
                                       search-project-auto-complete
                                       search-key="editProjectCtrl.searchKey"
                                       search-projects="editProjectCtrl.searchProjects"
                                       project="editProjectCtrl.project"
                                       project-members="editProjectCtrl.getGroupedMembersByProject"
                                       ng-disabled="editProjectCtrl.formReadOnly" />
                                <input type="hidden" ng-model="editProjectCtrl.project.redmineProjectId" name="redmineProjectId" required />
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="ProjectName" />
                            <div class="col-sm-6 col-md-4">
                                <input class="custom-textbox" type="text" name="projectName" ng-model="editProjectCtrl.project.name"
                                       ng-disabled="editProjectCtrl.formReadOnly" maxlength="200" placeholder="Project Name" />
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="StartDate">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <input type="text" class="custom-textbox custom-date" ng-model="editProjectCtrl.project.startDate"
                                       is-open="editProjectCtrl.calendar.startDateOpened" datepicker-popup="{{editProjectCtrl.dateFormat}}" placeholder="Start Date"
                                       id="startDate" name="startDate" readonly ng-disabled="editProjectCtrl.editProjectCtrl.formReadOnly" />
                                <calendar-image ng-click="editProjectCtrl.openPopupStartDate($event)" ng-hide="editProjectCtrl.editProjectCtrl.formReadOnly"></calendar-image>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="EndDate">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <input type="text" class="custom-textbox custom-date" ng-model="editProjectCtrl.project.endDate"
                                       is-open="editProjectCtrl.calendar.endDateOpened" placeholder="End Date" datepicker-popup="{{editProjectCtrl.dateFormat}}"
                                       id="endDate" readonly ng-disabled="editProjectCtrl.editProjectCtrl.formReadOnly" />
                                <calendar-image ng-click="editProjectCtrl.openPopupEndDate($event)" ng-hide="editProjectCtrl.editProjectCtrl.formReadOnly"></calendar-image>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="PM">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <select class="custom-textbox" name="projectManager" ng-model="editProjectCtrl.project.projectManager" ng-disabled="editProjectCtrl.formReadOnly">
                                    <option ng-repeat="pm in editProjectCtrl.pms" value="{{pm.employeeId}}" ng-selected="pm.employeeId == editProjectCtrl.project.projectManager">{{pm.nickName}} ({{pm.fullName}})</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="Status">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <select class="custom-textbox" ng-options="s.id as s.name for s in editProjectCtrl.status" name="status"
                                        ng-model="editProjectCtrl.project.status" ng-disabled="editProjectCtrl.formReadOnly">
                                    <option style="display: none" value="">-- Select a status --</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-sm-12 line">
                            <label class="col-sm-2 col-md-2" data-translate="Description">
                            </label>
                            <div class="col-sm-6 col-md-4">
                                <textarea class="custom-textarea" ng-model="editProjectCtrl.project.description"
                                          ng-disabled="editProjectCtrl.formReadOnly" maxlength="500"></textarea>
                            </div>
                        </div>
                    </div>
                    <div ng-if="false">
                        <div class="row boxtitle" data-translate="ProjectMilestone">
                        </div>
                        <div class="row boxcontent">
                            <div class="line">
                                <div ng-include src="'/Templates/Projects/ProjectMilestone.html'">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </tab>

            <tab heading="PROJECT MEMBERS" class="tab-cursor" active="editProjectCtrl.dataTab.member" select="editProjectCtrl.tabMemberSelect()">
                <div ng-include src="'/Templates/ProjectMembers/Index.html'">
                </div>
            </tab>

        </tabset>
    </div>
</div>
