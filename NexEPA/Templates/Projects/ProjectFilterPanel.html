<div class="row sub-header">
    <ul class="breadcrumb list-inline pull-left">
        <li><a href="#">Project</a></li>
        <li class="current">Project 1</li>
    </ul>
    <div class="button-icon">
        <span class="icon plus"></span><a href="/Projects/Create" data-translate="AddProject">
        </a>
    </div>
</div>
<form class="form-inline filter" role="form">
<div class="form-group">
    <label data-translate="ProjectManager">
    </label>
    <select class="form-control" ng-options="pm.employeeId as pm.fullName for pm in pms"
        ng-model="filter.projectManager">
        <option value="">-- All --</option>
    </select>
</div>
<div class="form-group">
    <label data-translate="Status">
    </label>
    <select class="form-control" ng-options="s.id as s.name for s in status" ng-model="filter.status">
        <option value="">-- All --</option>
    </select>
</div>
<div class="form-group">
    <label data-translate="Period">
    </label>
    <select class="form-control" ng-options="p.id as p.name for p in periods" ng-model="filter.period">
        <option value="">-- All --</option>
    </select>
</div>
<button type="button" class="btn btn-primary" ng-click="getProjectList(filter)" data-translate="Submit">
</button>
<!--<a class="btn btn-primary pull-right" href="/Projects/Create" data-translate="AddProject">-->
</a>
</form>
