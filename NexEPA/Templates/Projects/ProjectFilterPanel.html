<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="#">Project</a></li>
		<li class="current">Manage Project</li>
	</ul>
	<div class="button-icon" ng-show="createProjectPermission">
		<span class="icon plus"></span>
		<a href="/Projects/Create" data-translate="CreateProject"></a>
	</div>
</div>
<form class="row form-inline filter" role="form">
<div class="form-group">
	<label data-translate="ProjectManager">
	</label>
	<select class="form-control" ng-model="filter.projectManager" required>
		<option value="">-- All --</option>
		<option ng-repeat="pm in pms" value="{{pm.employeeId}}">{{pm.nickName}} ({{pm.fullName}})</option>
	</select>
</div>
<div class="form-group">
	<label data-translate="Status">
	</label>
	<select class="form-control" ng-options="s.id as s.name for s in status" ng-model="filter.status">
		<option value="">-- All --</option>
	</select>
</div>
<div class="form-group">
	<label data-translate="Period">
	</label>
	<select class="form-control" ng-options="p.id as p.name for p in periods" ng-model="filter.period">
		<option value="">-- All --</option>
	</select>
</div>
<a class="button" ng-click="getProjectList(filter)" data-translate="Submit"></a>
</form>
