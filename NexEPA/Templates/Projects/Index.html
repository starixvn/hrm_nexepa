
<div class="row">
    <div ng-include src="'/Templates/Projects/ProjectFilterPanel.html'">
    </div>
</div>
<div class="row" ng-init="initViewIndex()">
    <div class="span10">
        <table class="table table-striped table-condensed table-hover">
            <tr>
                <th>
                    Project
                </th>
                <th>
                    Milestone
                </th>
                <th>
                    PM
                </th>
                <th>
                    Members
                </th>
                <th>
                    Status
                </th>
                <th>
                    Start date
                </th>
                <th>
                    End date
                </th>
            </tr>
            <tr ng-repeat="project in projects">
                <td>
                    <a href="/Projects/Edit/{{project.projectId}}">{{project.name}}
                    </a>
                </td>
                <td>
                    milestone here
                </td>
                <td>
                    {{project.fullName}}
                </td>
                <td>
                    <a href="/ProjectMembers/View/{{project.projectId}}">{{project.members}}</a>
                </td>
                <td>
                    {{project.status|enumStatusText}}
                </td>
                <td>
                    {{project.startDate|date:'dd-MMM-yyyy'}}
                </td>
                <td>
                    {{project.endDate|date:'dd-MMM-yyyy'}}
                </td>
            </tr>
        </table>
    </div>
</div>
