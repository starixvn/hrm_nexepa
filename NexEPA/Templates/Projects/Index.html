<div class="row">
	<div ng-include src="'/Templates/Projects/ProjectFilterPanel.html'">
	</div>
</div>
<div class="row">
	<div class="span10">
		<table class="table table-bordered table-striped table-hover">
			<thead>
				<tr>
					<th data-translate="ProjectName">
					</th>
					<th data-translate="Milestone">
					</th>
					<th data-translate="PM">
					</th>
					<th class="member-limit" data-translate="Members">
					</th>
					<th data-translate="Status">
					</th>
					<th data-translate="StartDate">
					</th>
					<th data-translate="EndDate">
					</th>
				</tr>
			</thead>
			<tr ng-repeat="project in projects">
				<td class="column-limit">
					<a href="/Projects/Edit/{{project.projectId}}" ng-click="memberSelected(false)">{{project.name}}
					</a>
				</td>
				<td class="column-limit">
					<div data-angular-treeview="true" data-tree-id="milestoneTree" data-tree-model="treedata" data-node-id="id"
						data-node-label="label" data-node-children="children">
					</div>
					{{project.milestone.name}}
				</td>
				<td>
					{{project.fullName}}
				</td>
				<td class="text-center member-limit">
					<a href="/Projects/Edit/{{project.projectId}}" ng-click="memberSelected(true)">{{project.members}}</a>
				</td>
				<td class="text-center">
					{{project.status|enumStatusText}}
				</td>
				<td class="text-center">
					{{project.startDate|date:'dd MMM, yyyy'}}
				</td>
				<td class="text-center">
					{{project.endDate|date:'dd MMM, yyyy'}}
				</td>
			</tr>
			<tr ng-show="projects == ''">
				<td class="empty-result" colspan="7" data-translate="EmptyResult">
				</td>
			</tr>
		</table>
	</div>
</div>
