<a class="btn" href="/Projects/Create">Add Project</a>
<div class="row">
    <div ng-include src="'/Templates/Projects/ProjectFilterPanel.html'">
    </div>
</div>
<div class="row" ng-init="initViewIndex()">
    <div class="span10">
        <table class="table">
            <tr>
                <th>
                    Project
                </th>
                <th>
                    Milestone
                </th>
                <th>
                    PM
                </th>
                <th>
                    Members
                </th>
                <th>
                    Status
                </th>
                <th>
                    Start date
                </th>
                <th>
                    End date
                </th>
            </tr>
            <tr ng-repeat="project in projects">
                <td>
                    <a ng-click="editProject(project.projectId)" href="/Projects/Edit">{{project.name}}
                    </a>
                </td>
                <td>
                    milestone here
                </td>
                <td>
                    {{project.fullName}}
                </td>
                <td>
                    {{project.members}}
                </td>
                <td>
                    {{project.status|enumStatusText}}
                </td>
                <td>
                    {{project.startDate|date:'dd-MMM-yyyy'}}
                </td>
                <td>
                    {{project.endDate|date:'dd-MMM-yyyy'}}
                </td>
            </tr>
        </table>
    </div>
</div>
