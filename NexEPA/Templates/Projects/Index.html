<div class="row">
	<div ng-include src="'/Templates/Projects/ProjectFilterPanel.html'">
	</div>
</div>
<div class="row">
	<div class="span10">
		<table class="table table-bordered table-striped table-hover">
			<thead>
				<tr>
					<th data-translate="#">
					</th>
					<th data-translate="ProjectName">
					</th>
					<th data-translate="Milestone">
					</th>
					<th data-translate="PM">
					</th>
					<th class="member-limit" data-translate="Members">
					</th>
					<th data-translate="Status">
					</th>
					<th data-translate="StartDate">
					</th>
					<th data-translate="EndDate">
					</th>
					<th data-translate="Action">
					</th>
				</tr>
			</thead>
			<tr ng-repeat="project in projects">
				<td class="text-center">
					{{$index + 1}}
				</td>
				<td class="column-limit">
					<a href="" ng-click="detailProject(project,false)">{{project.name}} </a>
				</td>
				<td class="column-limit">
					<div data-angular-treeview="true" data-tree-id="milestoneTree" data-tree-model="project.milestoneTreeView"
						data-node-id="id" data-node-label="label" data-node-children="children">
					</div>
					{{project.milestone.name}}
				</td>
				<td>
					{{project.fullName}}
				</td>
				<td class="text-center member-limit">
					<a href="" ng-click="detailProject(project,true)">{{project.members}}</a>
				</td>
				<td class="text-center status-limit">
					<a ng-show="!project.isUpdateStatus" ng-click="toogleEditStatus(project)" href="javascript:;">
						{{project.status|enumStatusText}}</a>
					<select class="inline-status" ng-show="project.isUpdateStatus" ng-options="s.id as s.name for s in status"
						ng-model="project.status" ng-change="updateProjectStatus(project)">
					</select>
					<a class="glyphicon glyphicon-trash pull-right top-buffer" ng-show="project.isUpdateStatus"
						href="javascript:;" ng-click="toogleEditStatus(project)" title="Cancel"></a>
				</td>
				<td class="text-center">
					{{project.startDate | customDate}}
				</td>
				<td class="text-center">
					{{project.endDate| customDate}}
				</td>
				<td class="text-center">
					<a class="glyphicon glyphicon-edit icon-edit" title="Edit Project" href="javascript:;" ng-click="editProject(project.projectId)" />
					<a class="glyphicon glyphicon-remove icon-remove" title="Delete Project" href="javascript:;"
						ng-click="deleteProject(project)" />
				</td>
			</tr>
			<tr ng-show="projects == ''">
				<td class="empty-result" colspan="8" data-translate="EmptyResult">
				</td>
			</tr>
		</table>
	</div>
</div>
