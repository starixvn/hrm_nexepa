<!doctype html>
<html ng-app="projectsSettingModule">
<body>
    <div ng-controller="MilestoneCtrl" ng-cloak>
        <div style="width: 500px;">
            <table class="table table-striped table-bordered table-condensed table-hover">
                <tr>
                    <th>
                        Name
                    </th>
                    <th>
                        From Date
                    </th>
                    <th>
                        To Date
                    </th>
                    <th>
                        Description
                    </th>
                    <th style="width: 100px;">
                        <div class="btn-toolbar">
                            <i class="btn glyphicon glyphicon-plus" ng-click="toggleAddMode()">Add</i></div>
                    </th>
                </tr>
                <tr ng-show="addMode">
                    <td>
                        <input ng-model="milestone.name" />
                    </td>
                    <td>
                        <input ng-model="milestone.startDate" datepicker id="start2" />
                    </td>
                    <td>
                        <input ng-model="milestone.endDate" datepicker id="end2" />
                    </td>
                    <td>
                        <input ng-model="milestone.description" />
                    </td>
                    <td>
                        <div class="btn-toolbar">
                            <div class="btn-group">
                                <i class="btn glyphicon glyphicon-saved" ng-click="addMilestone()">save</i> <i class="btn glyphicon glyphicon-trash"
                                    ng-click="toggleAddMode()">cancel</i>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr ng-repeat="milestone in milestones | orderBy:'Id':true">
                    <td>
                        <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.name}}</span>
                        <input ng-model="milestone.name" ng-show="milestone.editMode == true" />
                    </td>
                    <td>
                        <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.startDate
                            | date:'dd-MMM-yyyy'}}</span>
                        <input ng-model="milestone.startDate" ng-show="milestone.editMode == true" datepicker1
                            id="start1" />
                    </td>
                    <td>
                        <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.endDate
                            | date:'dd-MMM-yyyy'}}</span>
                        <input ng-model="milestone.endDate" ng-show="milestone.editMode == true" datepicker1
                            id="end1" />
                    </td>
                    <td>
                        <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.description}}</span>
                        <input ng-model="milestone.description" ng-show="milestone.editMode == true" />
                    </td>
                    <td>
                        <div class="btn-toolbar" ng-show="milestone.editMode == null || milestone.editMode == false">
                            <div class="btn-group">
                                <i class="btn glyphicon glyphicon-edit" ng-click="toggleEditMode(milestone)">edit</i>
                                <i class="btn glyphicon glyphicon-remove" ng-click="deleteMilestone(milestone)">delete</i>
                            </div>
                        </div>
                        <div class="btn-toolbar" ng-show="milestone.editMode == true">
                            <div class="btn-group">
                                <i class="btn glyphicon glyphicon-saved" ng-click="updateMilestone(milestone)">save</i>
                                <i class="btn glyphicon glyphicon-trash" ng-click="toggleEditMode(milestone)">cancel</i>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
