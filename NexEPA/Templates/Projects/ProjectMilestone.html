<div ng-controller="MilestoneController">
        <table class="table table-striped table-bordered table-condensed table-hover">
            <tr>
                <th data-translate="Name">
                </th>
                <th data-translate="StartDate">
                </th>
                <th data-translate="EndDate">
                </th>
                <th data-translate="Description">
                </th>
                <th style="width: 100px;">
                    <div class="btn-toolbar">
                        <a class="btn glyphicon glyphicon-plus" ng-click="toggleAddMode()" title="Add">
                        </a>
                    </div>
                </th>
            </tr>
            <tr ng-show="addMode">
                <td>
                    <input ng-model="milestone.name" />
                </td>
                <td>
                    <input ng-model="milestone.startDate" datepicker-popup="dd-MMMM-yyyy" readonly id="start2" />
                </td>
                <td>
                    <input ng-model="milestone.endDate" datepicker-popup="dd-MMMM-yyyy" readonly id="end2" />
                </td>
                <td>
                    <input ng-model="milestone.description" />
                </td>
                <td>
                    <div class="btn-toolbar">
                        <div class="btn-group">
                            <a class="btn glyphicon glyphicon-saved" ng-click="addMilestone()" title="Save">
                            </a><a class="btn glyphicon glyphicon-trash" ng-click="toggleAddMode()" title="Cancel">
                            </a>
                        </div>
                    </div>
                </td>
            </tr>
            <tr ng-repeat="milestone in milestones | orderBy:'Id':true">
                <td>
                    <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.name}}</span>
                    <input ng-model="milestone.name" ng-show="milestone.editMode == true" />
                </td>
                <td>
                    <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.startDate
                        | date:'dd-MMM-yyyy'}}</span>
                    <input ng-model="milestone.startDate" ng-show="milestone.editMode == true" readonly
                        datepicker-popup="dd-MMMM-yyyy" id="start1" />
                </td>
                <td>
                    <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.endDate
                        | date:'dd-MMM-yyyy'}}</span>
                    <input ng-model="milestone.endDate" ng-show="milestone.editMode == true" readonly
                        datepicker-popup="dd-MMMM-yyyy" id="end1" />
                </td>
                <td>
                    <span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.description}}</span>
                    <input ng-model="milestone.description" ng-show="milestone.editMode == true" />
                </td>
                <td>
                    <div class="btn-toolbar" ng-show="milestone.editMode == null || milestone.editMode == false">
                        <div class="btn-group">
                            <a class="btn glyphicon glyphicon-edit" ng-click="toggleEditMode(milestone)" title="Edit">
                            </a><a class="btn glyphicon glyphicon-remove" ng-click="deleteMilestone(milestone)" title="Delete"></a>
                        </div>
                    </div>
                    <div class="btn-toolbar" ng-show="milestone.editMode == true">
                        <div class="btn-group">
                            <a class="btn glyphicon glyphicon-saved" ng-click="updateMilestone(milestone)" title="Save">
                            </a><a class="btn glyphicon glyphicon-trash" ng-click="toggleEditMode(milestone)" title="Cancel"></a>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
</div>
