<div ng-controller="MilestoneController">
	<div class="error-message buffer-error-message" ng-show="milestoneErrors.length > 0"
		id="addError" ng-repeat="error in milestoneErrors">
		{{error}}
	</div>
	<table class="table-project table table-bordered table-striped table-hover">
		<thead>
			<tr ng-show="addMode == false">
				<th data-translate="Name">
				</th>
				<th data-translate="StartDate">
				</th>
				<th data-translate="EndDate">
				</th>
				<th data-translate="Status">
				</th>
				<th data-translate="Description">
				</th>
				<th class="text-center" ng-show="isEditMode">
					<a href="javascript:;" class="glyphicon glyphicon-plus icon-add-header" ng-click="toggleAddMode()"
						title="Add" />
				</th>
			</tr>
		</thead>
		<thead ng-show="addMode">
			<tr class="required">
				<th class="control-label" data-translate="Name">
				</th>
				<th class="control-label" data-translate="StartDate">
				</th>
				<th class="control-label" data-translate="EndDate">
				</th>
				<th data-translate="Status">
				</th>
				<th data-translate="Description">
				</th>
				<th class="text-center">
					<a href="javascript:;" class="glyphicon glyphicon-plus icon-add-header" ng-click="toggleAddMode()"
						title="Add" />
				</th>
			</tr>
		</thead>
		<tr ng-show="addMode">
			<td class="column-limit">
				<input type="text" class="form-control" ng-model="milestone.name" />
			</td>
			<td class="text-center">
				<input type="text" class="custom-textbox custom-date milestone-date-width" ng-model="milestone.startDate"
					is-open="calendar.addModeStartDateOpened" datepicker-popup="{{dateFormat}}" readonly />
				<img class="calendar-image" ng-click="openPopupAddModeStartDate($event)" src="{{sourceCalendarImage}}"></img>
			</td>
			<td class="text-center">
				<input type="text" class="custom-textbox custom-date milestone-date-width" ng-model="milestone.endDate"
					is-open="calendar.addModeEndDateOpened" datepicker-popup="{{dateFormat}}" readonly />
				<img class="calendar-image" ng-click="openPopupAddModeEndDate($event)" src="{{sourceCalendarImage}}"></img>
			</td>
			<td>
				<select class="custom-textbox" ng-options="s.id as s.name for s in milestoneStatus"
					ng-model="milestone.status">
					<option style="display: none" value="">-- Select a status --</option>
				</select>
			</td>
			<td class="column-limit">
				<input type="text" class="form-control" ng-model="milestone.description" />
			</td>
			<td class="text-center">
				<a href="javascript:;" class="glyphicon glyphicon-saved icon-save" ng-click="addMilestone()"
					title="Save" />
				<a href="javascript:;" class="glyphicon glyphicon-trash icon-delete" ng-click="toggleAddMode()"
					title="Cancel" />
			</td>
		</tr>
		<tr ng-repeat="milestone in milestones | orderBy:'Id':true">
			<td class="column-limit">
				<span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.name}}</span>
				<input ng-model="milestone.name" class="form-control" ng-show="milestone.editMode == true" />
			</td>
			<td class="text-center">
				<span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.startDate
					| customDate}}</span>
				<input ng-model="milestone.startDate" class="custom-textbox custom-date milestone-date-width"
					ng-show="milestone.editMode == true" is-open="calendar.editModeStartDateOpened{{milestone.milestoneId}}"
					datepicker-popup="{{dateFormat}}" readonly id="start1" />
				<img ng-show="milestone.editMode == true" class="calendar-image" ng-click="openPopupEditModeStartDate($event, milestone.milestoneId)"
					src="{{sourceCalendarImage}}"></img>
			</td>
			<td class="text-center">
				<span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.endDate|
					customDate }}</span>
				<input ng-model="milestone.endDate" class="custom-textbox custom-date milestone-date-width"
					ng-show="milestone.editMode == true" is-open="calendar.editModeEndDateOpened{{milestone.milestoneId}}"
					datepicker-popup="{{dateFormat}}" readonly id="end1" />
				<img ng-show="milestone.editMode == true" class="calendar-image" ng-click="openPopupEditModeEndDate($event, milestone.milestoneId)"
					src="{{sourceCalendarImage}}"></img>
			</td>
			<td class="column-limit text-center">
				<span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.status|enumStatusText}}</span>
				<select class="custom-textbox" ng-options="s.id as s.name for s in milestoneStatus"
					ng-model="milestone.status" ng-show="milestone.editMode == true">
					<option style="display: none" value="">-- Select a status --</option>
				</select>
			</td>
			<td class="column-limit">
				<span ng-show="milestone.editMode == null || milestone.editMode == false">{{milestone.description}}</span>
				<input ng-model="milestone.description" class="form-control" ng-show="milestone.editMode == true" />
			</td>
			<td class="text-center" ng-show="isEditMode">
				<div ng-show="milestone.editMode == null || milestone.editMode == false">
					<a href="javascript:;" class="glyphicon glyphicon-edit icon-edit" ng-click="toggleEditMode(milestone)"
						title="Edit" />
					<a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" ng-click="deleteMilestone(milestone)"
						title="Delete" />
				</div>
				<div ng-show="milestone.editMode == true">
					<a href="javascript:;" class="glyphicon glyphicon-saved icon-save" ng-click="updateMilestone(milestone)"
						title="Save" />
					<a href="javascript:;" class="glyphicon glyphicon-trash icon-delete" ng-click="toggleEditMode(milestone)"
						title="Cancel" />
				</div>
			</td>
		</tr>
		<tr ng-show="milestones == ''">
			<td class="empty-result" colspan="6" data-translate="EmptyResult">
			</td>
		</tr>
	</table>
</div>
