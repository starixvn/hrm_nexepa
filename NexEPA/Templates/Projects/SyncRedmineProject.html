<div class="col-sm-12 sync-redmine-project" ng-controller="SyncRedmineProjectController as syncRedmineProjectCtrl">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="Project" data-ng-click="syncRedmineProjectCtrl.reload()"></a></li>
            <li class="current" data-translate="SyncProjectFromRedmine"></li>
        </ul>
    </div>
    <div class="row row-filter filter-max-width">
        <form data-novalidate class="form-horizontal common-form col-sm-12 filter">
            <div class="form-group">
                <label class="col-sm-2 control-label text-right" data-translate="ActivityPeriod"></label>
                <div class="col-sm-3">
                    <select ng-model="syncRedmineProjectCtrl.filter.monthPeriod" class="form-control">
                        <option value="3" data-translate="3 Months"></option>
                        <option value="6" data-translate="6 Months"></option>
                        <option value="9" data-translate="9 Months"></option>
                        <option value="12" data-translate="12 Months"></option>
                    </select>
                </div>
                <label class="col-sm-2 control-label text-right" data-translate="ProjectGroup"></label>
                <div class="col-sm-3">
                    <select ng-model="syncRedmineProjectCtrl.filter.projectGroupId" class="form-control"
                            ng-options="opt.projectId as opt.projectName for opt in syncRedmineProjectCtrl.parentProjects"
                            ng-change="syncRedmineProjectCtrl.getSubRedmineProjects()">
                        <option value="" data-translate="AllProjectGroup"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label text-right" data-translate="Project">
                </label>
                <div class="col-sm-3">
                    <add-class-to-role-filter multi-select input-model="syncRedmineProjectCtrl.subProjects" button-label="projectId"
                                              helper-elements="all reset filter" item-label="projectName" tick-property="ticked"
                                              max-labels="0" class="multi-select">
                    </add-class-to-role-filter>
                </div>
                <div class="col-sm-2">
                    <button class="button ladda-button" data-style="slide-up" data-loading-button data-is-started="syncRedmineProjectCtrl.isLoadingGetProjectButton"
                            data-ng-click="syncRedmineProjectCtrl.getRedmineProjects(true)">
                        <span class="ladda-label" data-translate="Submit"></span>
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="row fanex-grid" ng-show="syncRedmineProjectCtrl.projects !=null">
        <div class="freegrid" data-sync-redmine-project-grid data-project-data="syncRedmineProjectCtrl.projects" id="redmine-project-grid"
             data-sync-click="syncRedmineProjectCtrl.syncProjects" data-is-syncing="syncRedmineProjectCtrl.isLoadingSyncButton"
             data-view-project-member="syncRedmineProjectCtrl.viewProjectMembers" data-can-sync="syncRedmineProjectCtrl.canSync">
        </div>
    </div>
    <br />
</div>
