<h2>Edit KPI</h2>

<div class="row">
    <form novalidate name="form" class="col-md-3">
         <div>
            <div ng-show="submitted && form.$invalid">
                <div class="error" ng-show="form.itemName.$error.required">Please fill out the title!</div>
            </div>
            <div class="success" ng-show="success" ng-bind="successMessage"></div>
            <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
        </div>

        <div class="form-group">
            <label>Form</label>
            <select name="itemFormSelect" ng-disabled="true" ng-model="item.targetTypeId" 
                ng-options="opt.targetTypeId as opt.name for opt in formOptions" required class="form-control">
                </select>
        </div>
        <div class="form-group">
            <label>Group</label>
            <select name="itemGroupSelect" ng-disabled="true" ng-model="item.kpiGroupId" 
                ng-options="opt.kpiGroupID as opt.name for opt in groupOptions" required class="form-control">
                </select>
        </div>
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="itemName" ng-model="item.name" required class="form-control" />
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea ng-model="item.description" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <input type="checkbox" ng-checked="item.isRequireComment" ng-model="item.isRequireComment"/> Require evaluatee's comment
        </div>
        <button class="btn btn-primary" ng-click="save(item)">Save</button>
        <button class="btn btn-primary" ng-click="cancel()">Cancel</button>
    </form>
</div>
