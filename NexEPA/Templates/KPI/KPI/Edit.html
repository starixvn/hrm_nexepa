<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPI" ng-click="cancel()"></a></li>
            <li class="current" data-translate="EditKPI"></li>
        </ul>
    </div>
</div>

<div class="row">
    <form novalidate name="form" class="col-sm-6 form-horizontal common-form" role="form">
         <div class="form-group">
            <label class="col-sm-2"></label>
            <div class="col-sm-10">
                <div ng-show="submitted && form.$invalid">
                    <div class="error" ng-show="form.itemName.$error.required" data-translate="TitleRequire"></div>
                </div>
                <div class="success" ng-show="success" ng-bind="successMessage"></div>
                <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
            </div>
        </div>

        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-4">
                <select name="itemFormSelect" ng-disabled="true" ng-model="item.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" required class="form-control">
                    </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Group"></label>
            <div class="col-sm-10">
                <select class="form-control" multiple multi-select-chosen name="itemGroupSelect" 
                    ng-disabled="true" ng-model="item.kpiGroupIds" 
                    ng-options="opt.kpiGroupID as opt.name for opt in groupOptions" 
                    required>
                </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Title"></label>
            <div class="col-sm-10">
                <input type="text" maxlength="500" name="itemName" ng-model="item.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-10">
                <textarea ng-model="item.description" class="form-control"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-offset-2 col-sm-10">
                <input type="checkbox" ng-checked="item.isRequireComment" ng-model="item.isRequireComment"/> 
                    <span data-translate="RequireComment"></span>
            </label>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button class="button" ng-click="save(item)" ng-disabled="disabledSubmitButton" data-translate="Save"></button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
