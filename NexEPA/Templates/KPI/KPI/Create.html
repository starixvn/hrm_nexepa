<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPI" ng-click="cancel()"></a></li>
            <li class="current" data-translate="CreateKPI"></li>
        </ul>
    </div>
</div>

<div class="row">
    <form novalidate name="form" class="col-sm-5 form-horizontal common-form" role="form">
         <div class="form-group">
             <label class="col-sm-3"></label>
             <div class="col-sm-8">
                <div ng-show="submitted && form.$invalid">
                    <div class="error" ng-show="form.itemFormSelect.$error.required" data-translate="FormRequire" ></div>
                    <div class="error" ng-show="form.itemFormSelect.$valid && form.itemGroupSelect.$error.required" data-translate="GroupRequire"></div>
                    <div class="error" ng-show="form.itemFormSelect.$valid && form.itemGroupSelect.$valid &&
                            form.itemName.$error.required" data-translate="TitleRequire"></div>
                </div>
                <div class="success" ng-show="success" ng-bind="successMessage"></div>
                <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
            </div>
        </div>

        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Form"></label>
            <div class="col-sm-8">
                 <select name="itemFormSelect" ng-model="item.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" 
                    ng-change="getGroupByTargetType(item.targetTypeId)"
                    ng-disabled="!isCreatedFromKPI"
                    required class="form-control">
                    <option value="">-- Select the form --</option>
                 </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Group"></label>
            <div class="col-sm-8">
                  <select name="itemGroupSelect" ng-model="item.kpiGroupId_0" 
                    ng-options="opt.kpiGroupID as opt.name for opt in groupOptions"
                    ng-disabled="!isCreatedFromKPI" 
                    required class="form-control">
                    <option value="">-- Select the group --</option>
                  </select>
            </div>
            <a style=" vertical-align:middle;" add-new-group class="glyphicon glyphicon-plus icon-add" href="" ng-click="addGroup()" ng-model="groupKPI.numberGroup"></a>
         </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Title"></label>
            <div class="col-sm-8">
                <input type="text" maxlength="500" name="itemName" ng-model="item.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Description"></label>
            <div class="col-sm-8">
                <textarea ng-model="item.description" class="form-control"></textarea>
            </div>
        </div>
        <div class="form-group"> 
            <label class="col-sm-offset-3 col-sm-8">
                <input type="checkbox" ng-model="item.isRequireComment" />
                <span data-translate="RequireComment"></span>
             </label>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button class="button" ng-click="save(item)" ng-disabled="disabledSubmitButton" data-translate="Create"></button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
