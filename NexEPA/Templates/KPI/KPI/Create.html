<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPI"></a></li>
            <li class="current" data-translate="CreateKPI"></li>
        </ul>
        <div class="button-icon">
            <span class=""></span><a href="" ng-click="cancel()" data-translate="BackToList">
            </a>
        </div>
    </div>
</div>

<div class="row">
    <form novalidate name="form" class="col-sm-7 form-horizontal common-form" role="form">
         <div>
            <div class="col-sm-offset-2" ng-show="submitted && form.$invalid">
                <div class="error" ng-show="form.itemFormSelect.$error.required" data-translate="FormRequire" ></div>
                <div class="error" ng-show="form.itemFormSelect.$valid && form.itemGroupSelect.$error.required" data-translate="GroupRequire"></div>
                <div class="error" ng-show="form.itemFormSelect.$valid && form.itemGroupSelect.$valid &&
                        form.itemName.$error.required" data-translate="TitleRequire"></div>
            </div>
            <div class="success col-sm-offset-2" ng-show="success" ng-bind="successMessage"></div>
            <div class="error col-sm-offset-2" ng-show="!success" ng-bind="errorMessage"></div>
        </div>

        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-8">
                 <select name="itemFormSelect" ng-model="item.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" 
                    ng-change="getGroupByTargetType(item.targetTypeId)"
                    ng-disabled="!isCreatedFromKPI"
                    required class="form-control">
                    <option value="">-- Select the form --</option>
                 </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Group"></label>
            <div class="col-sm-8">
                  <select name="itemGroupSelect" ng-model="item.kpiGroupId" 
                    ng-options="opt.kpiGroupID as opt.name for opt in groupOptions"
                    ng-disabled="!isCreatedFromKPI" 
                    required class="form-control">
                    <option value="">-- Select the group --</option>
                  </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Title"></label>
            <div class="col-sm-8">
                <input type="text" name="itemName" ng-model="item.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-8">
                <textarea ng-model="item.description" class="form-control"></textarea>
            </div>
        </div>
        <div class="form-group"> 
            <label class="col-sm-offset-2 col-sm-10">
                <input type="checkbox" ng-model="item.isRequireComment" />
                <span data-translate="RequireComment"></span>
             </label>
        </div>
        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-primary" ng-click="save(item)" ng-disabled="disabledSubmitButton" data-translate="Create"></button>
            <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel"></button>
        </div>
    </form>
</div>
