<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPI" ng-click="cancel()"></a></li>
            <li class="current" data-translate="CreateKPI"></li>
        </ul>
    </div>
</div>

<div class="row">
    <form novalidate name="form" class="col-sm-6 form-horizontal common-form" role="form">
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-4">
                 <select name="itemFormSelect" ng-model="item.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" 
                    ng-change="getGroupByTargetType(item.targetTypeId)"
                    ng-disabled="!isCreatedFromKPI"
                    required class="form-control">
                 </select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Group"></label>
            <div class="col-sm-10">
                  <select data-placeholder="Select the group" multiple multi-select-chosen name="itemGroupSelect" 
                        ng-model="item.kpiGroupIds" ng-options="opt.kpiGroupID as opt.name for opt in groupOptions"
                        ng-disabled="!isCreatedFromKPI"
                        required class="form-control">
                  </select>
            </div>
         </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Title"></label>
            <div class="col-sm-10">
                <input type="text" maxlength="500" name="itemName" ng-model="item.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-10">
                <textarea ng-model="item.description" class="form-control"></textarea>
            </div>
        </div>
        <div class="form-group"> 
            <div class="col-sm-offset-2 col-sm-10">
                <input type="checkbox" ng-model="item.hasComment" />
                <span data-translate="HasComment"></span>
                <input class="KPI-require-comment" type="checkbox" ng-model="item.isRequireComment" ng-disabled="!item.hasComment"/>
                <span data-translate="RequireComment"></span>
             </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-8">
                <button class="button" ng-click="save(item, false)" ng-disabled="disabledSubmitButton" data-translate="Create"></button>
                <button class="button" ng-click="save(item, true)" ng-disabled="disabledSubmitButton" data-translate="CreateAndContinue"></button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
