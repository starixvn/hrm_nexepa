<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPI" ng-click="reload()"></a></li>
            <li class="current">
                 <span data-translate="ManageKPI"></span>
                 <span ng-show="!isViewAll && KPIList">of "{{KPIList[0].kpiGroupNames[0]}}"</span>
            </li>
        </ul>
        <div class="button-icon">
            <span class="icon plus"></span><a href="" ng-click="create()" data-translate="CreateKPI"></a>
        </div>
        <div class="button-icon" ng-show="!isViewAll">
            <span class="glyphicon glyphicon-arrow-left icon-back"></span>
            <a href="" ng-click="back()" data-translate="BackToList"></a>
        </div>
    </div>

    <div class="form-inline filter" ng-show="isViewAll">
        <form novalidate class="form-inline">
            <div ng-show="isViewAll" class="form-group">
                <label data-translate="Form"></label>
                <select name="formSelect" ng-model="filter.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" required class="form-control">
                    <option value="">-- All --</option>
                    </select>
            </div>
            <div ng-show="isViewAll" class="form-group">
                <label data-translate="Group"></label>
                <select name="itemGroupSelect" ng-model="filter.kpiGroupId" 
                    ng-options="opt.kpiGroupID as opt.name for opt in groupOptions | filter: {targetTypeId: filter.targetTypeId}"
                    required class="form-control">
                    <option value="">-- All --</option>
                </select>
            </div>
            <div class="form-group">
                <label data-translate="Status"></label>
                <select ng-model="activeFilter" class="form-control">
                    <option value="all">-- All --</option>
                    <option value="active" data-translate="Active"></option>
                    <option value="inactive" data-translate="Inactive"></option>
                </select>
            </div>
            <button ng-show="isViewAll" class="button" ng-click="query(filter.targetTypeId, filter.kpiGroupId)" 
                    ng-disabled="disabledSubmitButton" data-translate="Submit"></button>
        </form>
    </div>
</div>

<div class="row">
    <table ng-show="isViewAll" class="table table-bordered table-striped">
        <thead>
            <tr>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Title"></th>
                <th data-translate="Group"></th>
                <th data-translate="Active"></th>
                <th data-translate="Description"></th>
                <th data-translate="Action"></th>
            </tr>
        </thead>
        <tr ng-repeat="item in KPIList | filter:filterActive">
            <td class="KPI-index" ng-bind="$index + 1"></td>
            <td class="KPI-title" ng-bind="item.name"></td>
            <td class="KPI-group">
                <div class="group-toggle-show">
                    <span ng-bind="item.kpiGroupNames[0]"></span>
                    <a class="glyphicon glyphicon-plus-sign group-toggle-icon" ng-click="isCollapsed = !isCollapsed" 
                        ng-show="item.kpiGroupNames.length > 1 && isCollapsed == true" href="" title="View Other Groups"></a>
                    <a class="glyphicon glyphicon-minus-sign group-toggle-icon" ng-click="isCollapsed = !isCollapsed" 
                        ng-show="item.kpiGroupNames.length > 1 && isCollapsed == false" href="" title="Close"></a>
                </div>
                <div ng-show="item.kpiGroupNames.length > 1">
                   <ul collapse="isCollapsed" class="group-toggle-item">
                        <li ng-repeat="groupName in item.kpiGroupNames"" ng-show="!$first" ng-bind="groupName"></li>
                    </ul>
                </div>
            </td>
            <td class="KPI-group-active">
                <input type="checkbox" ng-checked="!item.isDisabled" ng-click="confirmActive(item)"/>
            </td>
            <td class="KPI-description" ng-bind="item.description"></td>
            <td class="KPI-action">
                <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="edit(item.kpiId)"/>
                <a class="glyphicon glyphicon-remove icon-remove" title="Delete" href="" ng-click="openDeletePopup(item)"/>
            </td>
        </tr>
        <tr ng-show="KPIList == ''">
            <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
        </tr>
    </table>

    <table ng-show="!isViewAll" class="table table-KPI table-bordered table-striped">
        <thead>
            <tr>
                <th data-translate="Title"></th>
                <th data-translate="Group"></th>
                <th data-translate="Active"></th>
                <th data-translate="Description"></th>
                <th data-translate="Action"></th>
            </tr>
        </thead>
        <tr ng-repeat="item in KPIList">
            <td class="KPI-title" ng-bind="item.name"></td>
            <td class="KPI-group">
                <div ng-repeat="groupName in item.kpiGroupNames">
                    <div ng-bind="groupName"></div>
                </div>
            </td>
            <td class="KPI-group-active">
                <input type="checkbox" ng-checked="!item.isDisabled" ng-click="confirmActive(item)"/>
            </td>
            <td class="KPI-description" ng-bind="item.description"></td>
            <td class="KPI-action">
                <a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="edit(item.kpiId)"/>
                <a class="glyphicon glyphicon-remove icon-remove" title="Delete" href="" ng-click="openDeletePopup(item)"/>
            </td>
        </tr>
        <tr ng-show="KPIList == ''">
            <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
        </tr>
    </table>
</div>
