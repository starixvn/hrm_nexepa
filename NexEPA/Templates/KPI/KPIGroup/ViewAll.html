
<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPIGroup"></a></li>
            <li class="current" data-translate="ManageKPIGroup"></li>
        </ul>
        <div class="button-icon">
            <span class="icon plus"></span><a href="" ng-click="create()" data-translate="CreateKPIGroup">
            </a>
        </div>
    </div>

    <div class="form-inline filter">
        <form novalidate class="form-inline">
            <div class="form-group">
                <label data-translate="Form"></label>
                <select name="formSelect" ng-model="filter.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" required class="form-control">
                    <option value="">-- All --</option>
                    </select>
            </div>
            <button class="btn btn-primary" ng-click="query(filter.targetTypeId)" data-translate="Submit"></button>
            <div class="error" ng-show="hasError" ng-bind="errorMessage"></div>
        </form>
    </div>
</div>

<div class="row">
    <div class="span10">
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th data-translate="Group"></th>
                    <th data-translate="Weight"></th>
                    <th data-translate="Criteria"></th>
                    <th data-translate="Form"></th>
                    <th data-translate="Active"></th>
                    <th data-translate="Action"></th>
                </tr>
            </thead>
            <tr ng-repeat="group in KPIGroupList">
                <td ng-bind="group.name"></td>
                <td ng-bind="group.weight"></td>
                <td>
                    <a href="" ng-show="group.numberKPI > 0" ng-click="viewKPI(group.targetTypeId,group.kpiGroupID)" ng-bind="group.numberKPI"></a>
                    <span ng-show="group.numberKPI === 0" ng-bind="0"></span>
                    </td>
                <td ng-bind="group.form"></td>
                <td>
                    <input type="checkbox" ng-checked="!group.isDisabled" ng-click="confirmActive(group)"/>
                </td>
                <td>
                    <a class="btn glyphicon glyphicon-edit" title="Edit" href="" ng-click="edit(group.kpiGroupID)"/>
                    <a class="btn glyphicon glyphicon-remove" title="Delete" href="" ng-click="openDeletePopup(group.kpiGroupID, group.name)"/>
                    <a class="btn glyphicon glyphicon-plus" title="Add KPI" href="" ng-click="addKPI(group.targetTypeId, group.kpiGroupID)" />
                </td>
            </tr>
        </table>
    </div>
</div>
