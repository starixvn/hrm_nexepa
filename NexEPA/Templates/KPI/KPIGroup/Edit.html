
 <h2>Edit KPI Group</h2>

 <div class="row">
    <form name="form" novalidate class="col-md-3">
          <div>
            <div ng-show="submitted && form.$invalid">
                 <div class="error" ng-show="form.groupName.$error.required">Please fill out the name!</div>
                 <div class="error" ng-show="form.groupName.$valid && form.groupWeight.$error.required">Please fill out the weight!</div>
                 <div class="error" ng-show="form.groupName.$valid && !form.groupWeight.$error.required &&
                        (form.groupWeight.$error.min || form.groupWeight.$error.max)">The value must be in range 0 to 100!</div> 
            </div> 
            <div class="success" ng-show="success" ng-bind="updateSuccessMessage"></div>
            <div class="error" ng-show="!success" ng-bind="updateErrorMessage"></div>
        </div>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="groupName" ng-model="editGroup.name" required class="form-control"/>
        </div>

        <div class="form-group">
            <label>Weight</label>
            <input type="number" name="groupWeight" ng-model="editGroup.weight" required 
                min="0" max="100" numbers-only="numbers-only" class="form-control" />
        </div>

        <div class="form-group">
            <label>Form</label>
            <select ng-model="editGroup.targetTypeId" 
                ng-options="opt.targetTypeId as opt.name for opt in formOptions"
                class="form-control"></select>
        </div>

        <div class="form-group">
            <input type="checkbox" ng-model="editGroup.isActive" ng-checked="!editGroup.isDisabled" /> Active
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea ng-model="editGroup.description" class="form-control"></textarea>
        </div>

        <button class="btn btn-primary" ng-click="update(editGroup)">Save</button>
        <button class="btn btn-primary" ng-click="cancel()">Cancel</button>
    </form>
</div>
