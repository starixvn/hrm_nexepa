<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPIGroup" ng-click="cancel()"></a></li>
            <li class="current" data-translate="EditKPIGroup"></li>
        </ul>
    </div>
</div>

 <div class="row">
    <form name="form" novalidate class="col-sm-6 form-horizontal common-form" role="form">
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-4">
                <select ng-model="editGroup.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions"
                    ng-change="formOnChange(editGroup)" ng-disabled="permission.policy == 1"
                    class="form-control"></select>
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-2 control-label" data-translate="Name"></label>
            <div class="col-sm-10">
                <input type="text" maxlength="500" name="groupName" ng-model="editGroup.name" required 
                    ng-disabled="permission.policy == 1" class="form-control"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-10">
                <textarea ng-model="editGroup.description" ng-disabled="permission.policy == 1" class="form-control"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-offset-2 col-sm-10">
                <input type="checkbox" ng-model="editGroup.isActive" ng-checked="!editGroup.isDisabled" ng-disabled="permission.policy == 1"/>
                    <span data-translate="Active"></span>
            </label>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button class="button" ng-click="update(editGroup)" ng-disabled="disabledSubmitButton" 
                    data-translate="Save" ng-if="permissioni.policy == 2">
                </button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
