<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPIGroup" ng-click="cancel()"></a></li>
            <li class="current" data-translate="CreateKPIGroup"></li>
        </ul>
    </div>
</div>

 <div class="row">
    <form novalidate name="form" class="col-sm-5 form-horizontal common-form" role="form">
<!--        <div class="form-group">
            <label class="col-sm-3"></label>
            <div class="col-sm-8">
                <div ng-show="submitted && form.$invalid">
                    <div class="error" ng-show="form.groupName.$error.required" data-translate="NameRequire"></div>
                    <div class="error" ng-show="form.groupName.$valid && form.groupSelect.$error.required" data-translate="FormRequire"></div>
                </div>
                <div class="success" ng-show="success" ng-bind="successMessage"></div>
                <div class="error" ng-show="!success" ng-bind="errorMessage"></div>
            </div>
        </div>-->

        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Name"></label>
            <div class="col-sm-8">
                <input type="text" maxlength="500" name="groupName" ng-model="group.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group required">
            <label class="col-sm-3 control-label" data-translate="Form"></label>
            <div class="col-sm-8">
                <select name="groupSelect" ng-model="group.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" 
                    ng-change="formOnChange(group)"
                    required class="form-control">
                    <option value="">-- Select the form --</option>
                 </select>
             </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label" data-translate="Description"></label>
            <div class="col-sm-8">
                <textarea ng-model="group.description" class="form-control" ></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-offset-3 col-sm-8">
                    <input type="checkbox" ng-model="group.isActive" />
                    <span data-translate="Active"></span>
            </label>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button class="button" ng-click="save(group)" ng-disabled="disabledSubmitButton" data-translate="Create"></button>
                <button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel"></button>
            </div>
        </div>
    </form>
</div>
