<div class="row">
    <div class="row sub-header">
        <ul class="breadcrumb list-inline pull-left">
            <li><a href="#" data-translate="KPIGroup"></a></li>
            <li class="current" data-translate="CreateKPIGroup"></li>
        </ul>
        <div class="button-icon">
            <span class=""></span><a href="" ng-click="cancel()" data-translate="BackToList">
            </a>
        </div>
    </div>
</div>

 <div class="row">
    <form novalidate name="form" class="form-horizontal" role="form">
        <div class="form-group">
            <div ng-show="submitted && form.$invalid">
                <div ng-show="form.groupName.$error.required" data-translate="NameRequire"></div>
                <div ng-show="form.groupName.$valid && form.groupWeight.$error.required" data-translate="WeightRequire"></div>
                <div ng-show="form.groupName.$valid && !form.groupWeight.$error.required &&
                    (form.groupWeight.$error.min || form.groupWeight.$error.max)" data-translate="WeightRangeRequire"></div>
                <div class="error col-sm-offset-2 col-sm-10" ng-show="form.groupName.$valid && form.groupWeight.$valid && form.groupSelect.$error.required" data-translate="FormRequire"></div>
            </div>
            <div  ng-show="success" ng-bind="saveSuccessMessage"></div>
            <div  ng-show="!success" ng-bind="saveErrorMessage"></div>
        </div>

        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Name"></label>
            <div class="col-sm-4">
                <input type="text" name="groupName" ng-model="group.name" required class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Weight"></label>
            <div class="col-sm-4">
                <input type="number" name="groupWeight" ng-model="group.weight" required min="0" max="100" 
                        numbers-only="numbers-only" class="form-control" />
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Form"></label>
            <div class="col-sm-4">
                <select name="groupSelect" ng-model="group.targetTypeId" 
                    ng-options="opt.targetTypeId as opt.name for opt in formOptions" required class="form-control">
                    <option value="">-- Select the form --</option>
                 </select>
             </div>
        </div>
        <div class="form-group">
            <label class="col-sm-offset-2 col-sm-10">
                    <input type="checkbox" ng-model="group.isActive" /><span data-translate="Active"></span>
            </label>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" data-translate="Description"></label>
            <div class="col-sm-4">
                <textarea ng-model="group.description" class="form-control" ></textarea>
            </div>
        </div>
        <div class="col-sm-offset-2 col-sm-10">
            <button class="btn btn-primary" ng-click="save(group)" data-translate="Create"></button>
            <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel"></button>
        </div>
    </form>
</div>
