<style>
	.tree
	{
		min-height: 890px;
		padding: 19px;
		margin-bottom: 20px;
		border: 1px solid #999;
		-webkit-border-radius: 4px;
		-moz-border-radius: 4px;
		border-radius: 4px;
		-webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.05);
		-moz-box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.05);
		box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.05);
	}
	.tree li
	{
		list-style-type: none;
		margin: 0;
		padding: 10px 5px 0 5px;
		position: relative;
	}
	.tree li::before, .tree li::after
	{
		content: '';
		left: -20px;
		position: absolute;
		right: auto;
	}
	.tree li::before
	{
		border-left: 1px solid #999;
		bottom: 50px;
		height: 100%;
		top: 0;
		width: 1px;
	}
	.tree li::after
	{
		border-top: 1px solid #999;
		height: 20px;
		top: 30px;
		width: 25px;
	}
	.tree li span, .tree li a
	{
		-moz-border-radius: 5px;
		-webkit-border-radius: 5px;
		border: 1px solid #999;
		border-radius: 5px;
		display: inline-block;
		padding: 3px 8px;
		text-decoration: none;
	}
	.tree li.parent_li > span
	{
		cursor: pointer;
	}
	.tree > ul > li::before, .tree > ul > li::after
	{
		border: 0;
	}
	.tree li:last-child::before
	{
		height: 30px;
	}
	.tree li.parent_li > span:hover, .tree li.parent_li > span:hover + ul li span
	{
		background: #eee;
		border: 1px solid #94a0b4;
		color: #000;
	}
</style>
<div class="tree col-sm-4">
	<ul>
		<li><span><i ng-click="bindTreeEvent()" class="glyphicon glyphicon-folder-open"></i></span>
			<a href="">{{department.name}}</a>
			<ul>
				<li ng-repeat="childLevel1 in department.children[0].children"><span><i class="glyphicon glyphicon-minus"
					ng-click="bindTreeEvent()"></i></span>
					<a href="">{{childLevel1.name}}</a>
					<ul>
						<li ng-repeat="childLevel2 in childLevel1.children[0].children"><span><i class="glyphicon glyphicon-minus"
							ng-click="bindTreeEvent()"></i></span>
							<a href="">{{childLevel2.name}}</a>
							<ul>
								<li ng-repeat="childLevel3 in childLevel2.children[0].children"><span><i class="glyphicon glyphicon-minus"
									ng-click="bindTreeEvent()"></i></span>
									<a href="">{{childLevel3.name}}</a>
									<ul>
										<li ng-repeat="childLevel4 in childLevel3.children[0].children"><span><i class="glyphicon glyphicon-minus"
											ng-click="bindTreeEvent()"></i></span>
											<a href="">{{childLevel4.name}}</a></li>
										<ul>
											<li ng-repeat="childLevel5 in childLevel4.children[0].children"><span><i class="glyphicon glyphicon-minus"
												ng-click="bindTreeEvent()"></i></span>
												<a href="">{{childLevel5.name}}</a>
											</li>
											<ul>
												<li ng-repeat="childLevel6 in childLevel5.children[0].children"><span><i class="glyphicon glyphicon-minus"
													ng-click="bindTreeEvent()"></i></span>
													<a href="">{{childLevel6.name}}</a>
												</li>
												<ul>
													<li ng-repeat="childLevel7 in childLevel6.children[0].children"><span><i class="glyphicon glyphicon-minus"
														ng-click="bindTreeEvent()"></i></span>
														<a href="">{{childLevel7.name}}</a>
													</li>
												</ul>
											</ul>
										</ul>
									</ul>
								</li>
							</ul>
						</li>
					</ul>
				</li>
			</ul>
		</li>
	</ul>
</div>
<div class="col-sm-4">

</div>
