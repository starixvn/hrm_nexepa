<form class="form-inline" role="form">
<div class="form-group">
   <label>
      <input type="checkbox" ng-model="filter.isdeleted"> Show deleted members
    </label>
</div>
<div class="form-group">
    <label>
        Status</label>
    <select class="form-control" ng-options="milestone.id as milestone.name for milestone in milestones" ng-model="filter.milestone">

    </select>
</div>

</form>
