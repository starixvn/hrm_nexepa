<form class="row form-inline filter" role="form" ng-show="projectMembersCtrl.showMembersFilter">
    <div class="form-group">
        <label data-translate="Milestone">
        </label>
        <select class="form-control column-limit" ng-options="m.milestoneId as m.name for m in projectMembersCtrl.milestones"
                ng-model="projectMembersCtrl.milestoneId">
            <option value="">-- All --</option>
        </select>
    </div>
    <div class="form-group">
        <input type="checkbox" ng-model="projectMembersCtrl.isShowDeletedMember" id="showDeleted" />
        <label for="showDeleted" data-translate="ShowDeletedMembers">
        </label>
    </div>
    <div class="form-group">
        <a class="button" ng-click="projectMembersCtrl.filterMember()"
           data-translate="Submit"></a>
    </div>
</form>
