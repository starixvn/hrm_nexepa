<form class="form-inline" role="form">
<div class="form-group">
    <input type="checkbox" ng-model="isdeleted" id="showDeleted" />
    <label for="showDeleted" data-translate="ShowDeletedMembers">
    </label>
</div>
<div class="form-group">
    <label class="span6 offset3" data-translate="Milestone">
    </label>
    <select class="form-control" ng-options="m.milestoneId as m.name for m in milestones"
        ng-model="milestone">
        <option value="">-- All --</option>
    </select>
</div>
<button type="button" class="btn btn-primary" ng-click="filterMember(isdeleted, milestone)"
    data-translate="Submit">
</button>
<a class="btn btn-primary pull-right" href="/ProjectMembers/Create" data-translate="Add Member">
</a>
</form>
