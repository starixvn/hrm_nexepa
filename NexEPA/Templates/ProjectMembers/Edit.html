<div class="modal-addKPI" id="modal-addKPI">
	<div class="modal-header">
		<span class="popup-header">Project Members</span>
	</div>
	<div class="modal-body">
		<form class="col-sm-11 form-horizontal common-form project-form" name="addMemberForm" novalidate>
		<div class="form-group">
			<div class="col-sm-offset-3 error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
				{{error}}
			</div>
			<div class="col-sm-6 control-label error-message hide-errormessage" id="memberValid">
				Please input all required (*) fields.</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"User" | translate}}</label>
			<div class="col-sm-8">
				<select class="form-control" ng-options="member.employeeId as member.fullName for member in lstMembers"
					ng-model="editMember.employeeId" required>
					<option style="display: none" value="">-- Select a member --</option>
				</select>
			</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"JoinedDate" | translate}}</label>
			<div class="col-sm-8">
				<input type="text" class="custom-textbox popup-date" ng-model="editMember.joinDate" placeholder="Start Date"
					datepicker-popup="dd MMMM, yyyy" id="startDate" readonly />
			</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"Role" | translate}}</label>
			<div class="col-sm-8">
				<span ng-repeat="role in roles">
					<label class="checkbox">
						<input type="checkbox" value="{{role.name}}" ng-model="role.selected" />
						{{role.name}}
					</label>
				</span>
			</div>
		</div>
		</form>
	</div>
	<div class="modal-footer">
		<button class="btn btn-primary customize" ng-click="ok(editMember)">
			OK</button>
		<button class="btn btn-default customize" ng-click="cancel()">
			Cancel</button>
	</div>
</div>
