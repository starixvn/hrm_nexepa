<div class="modal-addKPI" id="modal-addKPI">
    <div class="modal-header">
        <div class="popup-header">
            {{"ProjectMember" | translate}}<span class="close-popup" ng-click="editProjectMemberCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="col-sm-11 form-horizontal common-form project-form" name="addMemberForm" novalidate>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"User" | translate}}
                </label>
                <div class="col-sm-8">
                    <input class="form-control" ng-model="editProjectMemberCtrl.searchKey" disabled />
                </div>
            </div>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"JoinedDate" | translate}}
                </label>
                <div class="col-sm-8">
                    <input type="text" class="custom-popup-textbox custom-date" ng-model="editProjectMemberCtrl.editMember.member.joinDate"
                           placeholder="Start Date" is-open="editProjectMemberCtrl.calendar.opened" datepicker-popup="{{editProjectMemberCtrl.dateFormat}}"
                           id="startDate"
                           readonly />
                    <calendar-image class="calendar-image" ng-click="editProjectMemberCtrl.open($event)"></calendar-image>
                </div>
            </div>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"Role" | translate}}
                </label>
                <div class="col-sm-8">
                    <span ng-repeat="role in editProjectMemberCtrl.roles">
                        <label class="checkbox">
                            <input type="checkbox" value="{{role.name}}" ng-model="role.selected" />
                            {{role.name}}
                        </label>
                    </span>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="button" ng-click="editProjectMemberCtrl.ok()">
            OK
        </button>
        <button class="btn btn-default customize" ng-click="editProjectMemberCtrl.cancel()">
            Cancel
        </button>
    </div>
</div>
