<div ng-controller="ProjectMembersController">

	<div class="row">
		<div class="span10">
			<table class="table table-bordered table-striped table-hover" id="member-table">
				<thead>
					<tr>
						<th data-translate="Members">
						</th>
						<th data-translate="Roles">
						</th>
						<th data-translate="Evaluation">
						</th>
						<th data-translate="EvaluationDate">
						</th>
						<th data-translate="Action">
						</th>
					</tr>
				</thead>
				<tbody>
					<tr ng-repeat="member in members">
						<td>
							{{member.fullName}} ({{member.nickName}})
						</td>
						<td>
							{{member.name}}
						</td>
						<td>
							tbd
						</td>
						<td>
							tbd
						</td>
						<td class="text-center">
							<div class="btn-group">
								<a href="/ProjectMembers/Edit/ProjectId={{currentProject.projectId}}/EmployeeId={{member.employeeId}}"
									class="glyphicon glyphicon-edit" title="Edit"></a>
								<a href="javascript:;" class="glyphicon glyphicon-remove margin-icon" ng-click="deleteMember(member)"
									title="Delete"></a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
