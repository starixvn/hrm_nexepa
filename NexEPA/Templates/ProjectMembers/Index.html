<div ng-controller="ProjectMembersController">
	<div class="row">
		<div ng-include src="'/Templates/ProjectMembers/ProjectMembersFilterPanel.html'">
		</div>
	</div>
	<div class="row">
		<div class="span10">
			<table class="table table-bordered table-striped table-hover" id="member-table">
				<thead>
					<tr>
						<th data-translate="Members">
						</th>
						<th data-translate="Roles">
						</th>
						<th data-translate="JoinedDate">
						</th>
						<th class="text-center">
							<a href="javascript:;" ng-click="addMember()" class="glyphicon glyphicon-plus icon-add-header"
								title="Add" />
						</th>
					</tr>
				</thead>
				<tbody>
					<tr ng-repeat="member in members">
						<td>
							{{member.fullName}} ({{member.nickName}})
						</td>
						<td>
							{{member.name}}
						</td>
						<td>
							{{member.joinDate | date: 'dd MMM, yyyy'}}
						</td>
						<td class="text-center">
							<div class="btn-group">
								<a href="javascript:;" ng-click="updateMember(member.employeeId, member.joinDate)"
									class="glyphicon glyphicon-edit icon-edit" title="Edit"></a>
								<a href="javascript:;" class="glyphicon glyphicon-remove margin-icon icon-remove"
									ng-click="deleteMember(member)" title="Delete"></a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
