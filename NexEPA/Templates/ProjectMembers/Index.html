<div class="row">
    <div ng-include src="'/Templates/ProjectMembers/ProjectMembersFilterPanel.html'">
    </div>
</div>
<div class="row" ng-controller="ProjectMembersController" ng-init="initViewIndex()">
    <div class="span10">
        <table class="table table-striped table-condensed table-hover">
        <thead>
            <tr>
                <th>
                    Member
                </th>
                <th>
                    Role(s)
                </th>
                <th>
                    Evaluation
                </th>
                <th>
                    Evaluation date
                </th>
                <th>
                    Action
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="member in members">
                <td>
                    {{member.fullName}} ({{member.nickName}})
                </td>
                <td>
                    {{member.name}}
                </td>
                <td>
                </td>
                <td>
                </td>
                <td>
                    <div class="btn-group">
                        <i class="btn glyphicon glyphicon-edit" ng-click="editMember(member)">edit</i>
                        <i class="btn glyphicon glyphicon-remove" ng-click="deleteMember(member)">delete</i>
                    </div>
                </td>
            </tr>
        </tbody>
        </table>
    </div>
</div>
