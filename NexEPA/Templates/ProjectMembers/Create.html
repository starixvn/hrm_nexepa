<form class="form-horizontal" name="addMemberForm" novalidate ng-init = "initViewAdd()">
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10" style="color: red;" ng-show="errors.length > 0"
        ng-repeat="error in errors">
        {{error}}
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">
        User</label>
    <div class="col-sm-4">
        <select class="form-control" ng-options="pm.employeeId as pm.fullName for pm in pms"
            ng-model="project.projectManager">
            <option style="display: none" value="">-- Select a Project Manager --</option>
        </select>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">
        Role</label>
    <div class="col-sm-4">
        <span ng-repeat="role in roles">
            <label class="checkbox" for="{{role.projectRoleId}}">
                <input type="checkbox" ng-model="role.projectRoleId" name="group"
                    id="{{role.projectRoleId}}" />
                {{role.name}}
            </label>
        </span>
    </div>
</div>
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-default" ng-disable="addProjectForm.$invalid" ng-click="save(project)">
            Submit</button>
    </div>
</div>
</form>
