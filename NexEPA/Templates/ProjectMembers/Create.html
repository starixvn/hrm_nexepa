<div class="row sub-header">
    <ul class="breadcrumb list-inline pull-left">
        <li><a href="/Projects/Index">Project</a></li>
        <li><a href="/ProjectMembers/View/{{currentProject.projectId}}">Project member - {{currentProject.name}}</a></li>
        <li class="current">Add Members</li>
    </ul>
</div>
<form class="col-sm-6 form-horizontal common-form" name="addMemberForm" novalidate>
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10" style="color: red;" ng-show="errors.length > 0"
        ng-repeat="error in errors">
        {{error}}
    </div>
    <div class='col-sm-offset-2 col-sm-10' style='color: red; display: none;' id='memberValid'>
        Please select a role(s).</div>
</div>
<div class="form-group required">
    <label class="col-sm-2 control-label">{{"User" | translate}}</label>
    <div class="col-sm-5">
        <select class="form-control" ng-options="member.employeeId as member.fullName for member in members"
            ng-model="employeeId" required>
            <option style="display: none" value="">-- Select a member --</option>
        </select>
    </div>
</div>
<div class="form-group required">
    <label class="col-sm-2 control-label">{{"Role" | translate}}</label>
    <div class="col-sm-5">
        <span ng-repeat="role in roles">
            <label class="checkbox">
                <input type="checkbox" value="{{role.name}}" ng-model="role.selected" />
                {{role.name}}
            </label>
        </span>
    </div>
</div>
<div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-primary" ng-disabled="addMemberForm.$invalid" ng-click="addMember(employeeId)" data-translate="Submit"></button>
        <button class="btn btn-primary" ng-click="cancel()" data-translate="Cancel"></button>
    </div>
</div>
</form>
