<div class="modal-addKPI" id="modal-addKPI">
	<div class="modal-header">
		<div class="popup-header">
			{{"ProjectMember" | translate}}<span class="close-popup" ng-click="cancel()"></span></div>
	</div>
	<div class="modal-body">
		<form class="col-sm-11 form-horizontal common-form project-form" name="addMemberForm"
		novalidate>
		<div class="col-sm-offset-3">
			<div class="error-message buffer-error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
				{{error}}
			</div>
			<div class="error-message hide-errormessage buffer-error-message" id="memberValid">
				Please input all required (*) fields.</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"User" | translate}}</label>
			<div class="col-sm-8">
				<input class="form-control custom-padding" ng-model="searchKey" placeholder="full name or nick name"
					search-auto-complete search-employees="searchEmployees" ng-change="getEmployee(searchKey)"
					employee="newMember.employee" id="txtEmployee" roles="roles"/>
			</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"JoinedDate" | translate}}</label>
			<div class="col-sm-8">
				<input type="text" class="custom-popup-textbox custom-date" ng-model="newMember.joinDate" placeholder="Start Date"
					is-open="calendar.opened" datepicker-popup="{{dateFormat}}" id="startDate" readonly />
				<calendar-image class="calendar-image" ng-click="open($event)"></calendar-image>
			</div>
		</div>
		<div class="form-group popup-required">
			<label class="col-sm-3 control-label">
				{{"Role" | translate}}</label>
			<div class="col-sm-8">
				<div class="checkbox" ng-repeat="role in roles">
					<input type="checkbox" value="{{role.name}}" ng-model="role.selected" />
					<span ng-bind="role.name"></span>
				</div>
			</div>
		</div>
		</form>
	</div>
	<div class="modal-footer">
		<button class="button" ng-click="ok(true)" data-translate="AddContinue">
		</button>
		<button class="button" ng-click="ok(false)" data-translate="Add">
			</button>
		<button class="btn btn-default customize" ng-click="cancel()">
			Cancel</button>
	</div>
</div>
