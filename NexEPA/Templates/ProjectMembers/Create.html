<div class="modal-addKPI" id="modal-addKPI">
    <div class="modal-header">
        <div class="popup-header">
            {{"ProjectMember" | translate}}<span class="close-popup" ng-click="addProjectMembersCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="col-sm-11 form-horizontal common-form project-form" name="addMemberForm"
              novalidate>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"User" | translate}}
                </label>
                <div class="col-sm-8">
                    <input class="form-control custom-padding" ng-model="addProjectMembersCtrl.searchKey" placeholder="full name or nick name"
                           search-auto-complete search-employees="addProjectMembersCtrl.searchEmployees" ng-change="addProjectMembersCtrl.getEmployee()"
                           employee="addProjectMembersCtrl.employee" id="txtEmployee" />
                </div>
            </div>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"JoinedDate" | translate}}
                </label>
                <div class="col-sm-8">
                    <input type="text" class="custom-popup-textbox custom-date" ng-model="addProjectMembersCtrl.newMember.member.joinDate" placeholder="Start Date"
                           is-open="addProjectMembersCtrl.calendar.opened" datepicker-popup="{{addProjectMembersCtrl.dateFormat}}" id="startDate" readonly />
                    <calendar-image class="calendar-image" ng-click="addProjectMembersCtrl.open($event)"></calendar-image>
                </div>
            </div>
            <div class="form-group popup-required">
                <label class="col-sm-3 control-label">
                    {{"Role" | translate}}
                </label>
                <div class="col-sm-8">
                    <div class="checkbox" ng-repeat="role in addProjectMembersCtrl.roles">
                        <input type="checkbox" value="{{role.name}}" ng-model="role.selected" />
                        <span ng-bind="role.name"></span>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button class="button" ng-click="addProjectMembersCtrl.ok(true)" data-translate="AddContinue"></button>
        <button class="button" ng-click="addProjectMembersCtrl.ok(false)" data-translate="Add"></button>
        <button class="btn btn-default customize" ng-click="addProjectMembersCtrl.cancel()">
            Cancel
        </button>
    </div>
</div>
