<div ng-controller="DateDetailController">
	<div class="row boxtitle" ng-click="collapseTable()">
		<span class="home-label" data-translate="DateDetail"></span>
	</div>

	<div class="row" collapse="isCollapsed">
		<table class="table table-bordered appraisal-table" name="appraisalForm">
			<thead class="required">
				<tr>
					<th data-translate="Role">
					</th>
					<th data-translate="NoticeAtBegin">
					</th>
					<th class="control-label center" data-translate="StartDate">
					</th>
					<th class="control-label center" data-translate="EndDate">
					</th>
					<th class="control-label center" data-translate="AlarmDate">
					</th>
				</tr>
			</thead>
			<tr ng-repeat="process in processList">
				<td ng-bind="process.name">
				</td>
				<td class="notice-at-begin">
					<input type="checkbox" name="notice" ng-model="process.noticeAtBegin"/>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.startDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.startDateOpened{{process.processId}}" show-button-bar="false" start="{{process.processId}}" processId="{{process.processId}}"/>
					<calendar-image class="calendar-image" close-other-calendar ></calendar-image>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.endDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.endDateOpened{{process.processId}}" show-button-bar="false" end="{{process.processId}}"  processId="{{process.processId}}"/>
					<calendar-image class="calendar-image" close-other-calendar ></calendar-image>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.remindDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.alarmDateOpened{{process.processId}}" show-button-bar="false" alarm="{{process.processId}}"  processId="{{process.processId}}"/>
					<calendar-image class="calendar-image" close-other-calendar ></calendar-image>
				</td>
			</tr>
		</table>
	</div>
</div>
