<div ng-controller="DateDetailController">
	<div class="row boxtitle" ng-click="collapseTable()">
		<span class="home-label" data-translate="DateDetail"></span>
	</div>

	<div class="row" collapse="isCollapsed">
		<table class="table table-bordered appraisal-table" name="appraisalForm">
			<thead class="required">
				<tr>
					<th data-translate="Role">
					</th>
					<th class="notice-at-begin" data-translate="NoticeAtBegin">
					</th>
					<th class="control-label center" data-translate="StartDate">
					</th>
					<th class="control-label center" data-translate="EndDate">
					</th>
					<th class="control-label center" data-translate="AlarmDate">
					</th>
					<th data-translate="Code" ng-if="isEditMode">
					</th>
					<th ng-if="isEditMode">
					</th>
				</tr>
			</thead>
			<tr ng-repeat="process in processList">
				<td ng-bind="process.name">
				</td>
				<td class="notice-at-begin">
					<input type="checkbox" name="notice" ng-model="process.noticeAtBegin" ng-disabled="permission.policy == 1"/>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.startDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.startDateOpened{{process.processId}}" show-button-bar="false" start="{{process.processId}}" 
						processId="{{process.processId}}" ng-disabled="permission.policy == 1" />
					<calendar-image class="calendar-image" close-other-calendar ng-if="permission.policy == 2"></calendar-image>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.endDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.endDateOpened{{process.processId}}" show-button-bar="false" end="{{process.processId}}" 
						processId="{{process.processId}}" ng-disabled="permission.policy == 1" />
					<calendar-image class="calendar-image" close-other-calendar ng-if="permission.policy == 2"></calendar-image>
				</td>
				<td class="center">
					<input class="calendar-form-control" required name="calendar" type="text" ng-model="process.remindDate" datepicker-popup="{{dateFormat}}"
						is-open="calendar.alarmDateOpened{{process.processId}}" show-button-bar="false" alarm="{{process.processId}}" 
						processId="{{process.processId}}" ng-disabled="permission.policy == 1" />
					<calendar-image class="calendar-image" close-other-calendar ng-if="permission.policy == 2"></calendar-image>
				</td>
				<td ng-if="isEditMode">
					<div ng-repeat="evaluator in process.evaluatorList" >
						<span ng-if="!$last">{{evaluator.code + ';'}}</span>
						<span ng-if="$last">{{evaluator.code}}</span>
					</div>
				</td>
				<td ng-if="isEditMode">
					<a ng-if="process.evaluatorList[0].employeeId != -1" class="glyphicon glyphicon-user" title="Edit"
						href="" ng-click="editEvaluator(process, process.evaluatorList)" />
				</td>
			</tr>
		</table>
	</div>
</div>
