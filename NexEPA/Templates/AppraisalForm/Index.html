<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li><a href="#" data-translate="AppraisalForm" ng-click="reload()"></a></li>
		<li class="current" data-translate="ManageAppraisalForm"></li>
	</ul>
	<div class="button-icon" ng-if="permission.policy == 2">
	<span class="icon plus"></span><a href="" ng-href="{{createAppraisalUrl}}" ng-click="create()"
		data-translate="CreateAppraisalForm"></a>
	</div>
</div>

<div class="row">
	<div class="form-inline filter">
		<form novalidate class="form-inline">
			<div class="form-group">
				<label data-translate="EPAType">
				</label>
				<select ng-model="filter.epaTypeId" ng-options="opt.epaTypeId as opt.name for opt in listEPAType"
					class="form-control">
					<option value="">-- Select EPA Type --</option>
				</select>
			</div>

			<div class="form-group">
				<label data-translate="Year">
				</label>
				<select ng-model="filter.year" ng-options="opt.value as opt.label for opt in listYear" class="form-control">
				</select>
			</div>

			<div class="form-group">
				<label data-translate="Month">
				</label>
				<select ng-model="filter.month" ng-options="opt.value as opt.label for opt in listMonth" class="form-control">
				</select>
			</div>

			<div class="form-group">
				<label data-translate="Keyword">
				</label>
				<input class="form-control lstBox-limit" type="text" ng-model="filter.keyword" placeholder="full name or nick name" />
			</div>

			<div class="form-group">
				<button class="button" ng-click="query(filter)" data-translate="Submit">
				</button>
			</div>
		</form>
	</div>
</div>

<div class="row">
	<table class="col-sm-12 table table-bordered table-striped">
		<thead>
			<th class="appraisal-index" data-translate="SymbolCount">
			</th>
			<th class="appraisal-code" data-translate="Code">
			</th>
			<th class="appraisal-nickName" data-translate="NickName">
			</th>
			<th class="appraisal-year" data-translate="Year">
			</th>
			<th class="appraisal-month" data-translate="Month">
			</th>
			<th class="appraisal-epaType" data-translate="EPATypeName">
			</th>
			<th class="appraisal-fromDate" data-translate="FromDate">
			</th>
			<th class="appraisal-toDate" data-translate="ToDate">
			</th>
			<th class="appraisal-status" data-translate="Status">
			</th>
			<th class="appraisal-action" data-translate="Action">
			</th>
		</thead>
		<tbody>
			<tr ng-repeat="appraisal in appraisalFormList">
				<td class="appraisal-index" ng-bind="$index + 1">
				</td>
				<td class="appraisal-code" ng-bind="appraisal.employee.code">
				</td>
				<td class="appraisal-nickName">
					<div ng-bind="appraisal.employee.nickName" tooltip={{appraisal.employee.fullName}} ></div>
				</td>
				<td class="appraisal-year" ng-bind="appraisal.year">
				</td>
				<td class="appraisal-month" ng-bind="appraisal.month">
				</td>
				<td class="appraisal-epaType" ng-bind="appraisal.epaType.name">
				</td>
				<td class="appraisal-fromDate">{{appraisal.startDate | customDate}}
				</td>
				<td class="appraisal-toDate">{{appraisal.endDate | customDate}}
				</td>
				<td class="appraisal-status">
					<span class="dropdown" ng-if="permission.policy == 2">
						<a class="dropdown-toggle changeStatus" href="" ng-bind="appraisal.statusName"></a>
						<ul class="dropdown-menu dropdown-menu-width">
							<li ng-repeat="status in statusOptions | filter:{name:'!'+appraisal.statusName}">
								<a href="" ng-bind="status.name" ng-click="updateStatus(appraisal, status)"></a>
							</li>
						</ul>
					</span>
					<span ng-if="permission.policy == 1" ng-bind="appraisal.statusName">
					</span>
				</td>
				<td class="appraisal-action">
					<a class="glyphicon glyphicon-edit icon-edit" title="Edit" href="" ng-click="edit(appraisal.epaId)" ng-href="{{editAppraisalUrl}}" />
					<a class="glyphicon glyphicon-remove icon-remove" title="Delete" href="" 
						ng-click="openDeletePopup(appraisal)" ng-if="permission.policy == 2" />
				</td>
			</tr>

			<tr ng-show="appraisalFormList == ''">
				<td class="empty-result" colspan="10" data-translate="EmptyResult">
				</td>
			</tr>
		</tbody>
	</table>
</div>
