<div ng-controller="BasicInformationController">
	<div class="row boxtitle first" ng-click="collapseTable()">
		<span class="home-label" data-translate="BasicInformation"></span>
	</div>

	<div class="row" collapse="isCollapsed">
		<div class="form-group required">
			<label class="col-sm-3 control-label" data-translate="EPAType">
			</label>
			<div class="col-sm-8">
				<select ng-model="appraisal.epaTypeId" ng-options="opt.epaTypeId as opt.name for opt in listEPAType"
					class="form-control">
				<option value="">-- Select type --</option>
				</select>
			</div>
		</div>

		<div class="form-group required">
			<label class="col-sm-3 control-label" data-translate="Year">
			</label>
			<div class="col-sm-8">
				<select ng-model="appraisal.year" ng-options="opt.value as opt.label for opt in listYear"
					class="form-control">
				</select>
			</div>
		</div>

		<div class="form-group required">
			<label class="col-sm-3 control-label" data-translate="Month">
			</label>
			<div class="col-sm-8">
				<select ng-model="appraisal.month" ng-options="opt.value as opt.label for opt in listMonth"
					class="form-control">
				</select>
			</div>
		</div>

		<div class="form-group required">
			<label class="col-sm-3 control-label" data-translate="Employee">
			</label>
			<div class="col-sm-8">
				<input class="form-control" ng-model="search.searchKey" placeholder="full name or nick name" ng-change="getEmployee(search.searchKey)"
					search-auto-complete search-key="search.searchKey" search-employees="searchEmployees" employee="appraisal.employee"/>
			</div>
		</div>
	</div>
</div>
