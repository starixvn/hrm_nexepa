<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li><a href="#" data-translate="TargetEmployeeSetting" ng-click="reload()"></a></li>
		<li class="current" data-translate="AssignTargetTemplateToUser"></li>
	</ul>
</div>

<div class="row">
	<div class="form-inline filter">
		<form novalidate class="form-inline">
			<div class="form-group">
				<label data-translate="EPAType">
				</label>
				<select ng-model="filter.epaTypeId" ng-options="opt.epaTypeId as opt.name for opt in listEPAType"
					required class="form-control">
					<option value="">-- Select EPA Type --</option>
				</select>
			</div>
			<div class="form-group">
				<label data-translate="Department">
				</label>
				<select ng-model="filter.departmentId" ng-options="opt.value as opt.label for opt in departmentOptions"
					required class="form-control">
					<option value="">-- Select Department --</option>
				</select>
			</div>
			<div class="form-group">
				<button class="button" ng-click="query(filter.epaTypeId, filter.departmentId)" ng-disabled="submitted"
					data-translate="Submit">
				</button>
			</div>
		</form>
	</div>
</div>

<div class="row">
	<table class="table table-bordered table-striped target-employee-setting">
		<thead>
			<th data-translate="SymbolCount">
			</th>
			<th data-translate="Code">
			</th>
			<th data-translate="NickName">
			</th>
			<th data-translate="FullName">
			</th>
			<th data-translate="TargetTemplate">
			</th>
		</thead>
		<tbody>
			<tr ng-repeat="employee in targetEmployees">
				<td class="index" ng-bind="$index + 1">
				</td>
				<td class="code" ng-bind="employee.code">
				</td>
				<td class="nick-name" ng-bind="employee.nickName">
				</td>
				<td ng-bind="employee.fullName">
				</td>
				<td>
					<span class="dropdown" ng-if="permission.policy == 2">
						<a class="dropdown-toggle changeStatus" href="" ng-if="!employee.name"> Choose target template! 
						</a>
						<a class="dropdown-toggle changeStatus" href="" ng-if="employee.name" ng-bind="employee.name">
						</a>
						<ul class="dropdown-menu ">
							<li ng-repeat="template in targetTemplates | filter:{name:'!'+employee.name}">
								<a href="" ng-bind="template.name" ng-click="updateTargetTemplate(employee, template, filter.epaTypeId)">
								</a>
							</li>
						</ul>
					</span>
					<span ng-bind="employee.name" ng-if="permission.policy == 1">
					</span>
				</td>
			</tr>
			<tr ng-show="targetEmployees == ''">
				<td class="empty-result" colspan="5" data-translate="EmptyResult">
				</td>
			</tr>
		</tbody>
	</table>
</div>
