<div class="row sub-header">
    <ul class="col-xs-12 breadcrumb list-inline pull-left">
        <li><a href="/TargetTemplate/Index" data-translate="TargetTemplate"></a></li>
            <li class="current">Details Target Template - {{currentTargetTemplateName}}</li>
    </ul>
</div>
<form class="row common-form project-form" name="detailTargetTemplate" id="detailTargetTemplate"
novalidate>
<div>
    <div class="row boxtitle first">
        TARGET TEMPLATE INFORMATIONS
    </div>
    <div class="row boxcontent information">
        <div class="col-sm-12 line">
            <label class="col-sm-2 col-md-1">
                {{"Name" | translate}}</label>
            <div class="col-sm-6 col-md-4">
                <input type="text" class="custom-textbox" ng-model="editTemplate.name" placeholder="Name"
                    readonly />
            </div>
        </div>
        <div class="col-sm-12 line">
            <label class="col-sm-2 col-md-1">
                {{"TargetType" | translate}}
            </label>
            <div class="col-sm-6 col-md-4">
                <select class="custom-textbox" ng-options="tgType.targetTypeId as tgType.name for tgType in tgTypes"
                    ng-model="editTemplate.targetTypeId" disabled>
                    <option style="display: none" value="">-- Select a target type --</option>
                </select>
            </div>
        </div>
        <div class="col-sm-12">
            <label class="col-sm-2 col-md-1" data-translate="Description">
            </label>
            <div class="col-sm-6 col-md-4">
                <textarea class="custom-textarea" ng-model="editTemplate.description" id="description"
                    readonly></textarea>
            </div>
        </div>
    </div>
    <div class="row boxtitle">
        KPI LIST
    </div>
    <div class="row boxcontent">
        <ul class="row-item col-sm-12 list-unstyled kpi-list" ng-repeat="kpi in lstKPI | filter: KPIName">
            <li class="title-list"><strong>{{ kpi.kpiGroupName }}</strong></li>
            <li ng-repeat="item in kpi.kpiGroupItems | filter: KPIName"><span class="glyphicon glyphicon-ok icon-list"></span>{{item.name}}</li>
        </ul>
    </div>
    <div class="row action-button">
        <button class="btn btn-default customize" ng-click="back()" data-translate="Back">
        </button>
    </div>
</div>
</form>
