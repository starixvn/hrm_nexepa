<form class="col-sm-11 common-form project-form" name="detailTargetTemplate" id="detailTargetTemplate"
novalidate>
<div>
	<div class="boxtitle">
		TARGET TEMPLATE INFORMATIONS
	</div>
	<div class="boxcontent">
		<div class="line top-buffer">
			<label class="col-sm-2 control-label">
				{{"Name" | translate}}</label>
			<div class="row">
				<input type="text" class="custom-textbox custom-width" ng-model="editTemplate.name"
					placeholder="Name" readonly />
			</div>
		</div>
		<div class="line">
			<label class="col-sm-2 control-label">
				{{"TargetType" | translate}}
			</label>
			<div class="row">
				<select class="custom-textbox custom-width" ng-options="tgType.targetTypeId as tgType.name for tgType in tgTypes"
					ng-model="editTemplate.targetTypeId" disabled>
					<option style="display: none" value="">-- Select a target type --</option>
				</select>
			</div>
		</div>
		<div class="line">
			<label class="col-sm-2 control-label" data-translate="Description">
			</label>
			<div class="row">
				<textarea class="custom-textarea custom-width" ng-model="editTemplate.description"
					id="description" readonly></textarea>
			</div>
		</div>
	</div>
	<div class="boxtitle">
		KPI LIST
	</div>
	<div class="boxcontent">
		<ul class="col-sm-6 epa-criteria-ol" ng-repeat="kpi in lstKPI | filter: KPIName">
			<strong>{{ kpi.kpiGroupName }}</strong> <span ng-repeat="item in kpi.kpiGroupItems | filter: KPIName">
				<li>{{item.name}}</li>
			</span>
		</ul>
	</div>
	<div class="line">
		<div class="col-sm-12 action-button">
			<button class="btn btn-default customize" ng-click="back()" data-translate="Back">
			</button>
		</div>
	</div>
</div>
</form>
