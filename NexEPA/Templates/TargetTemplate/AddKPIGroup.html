<div class="modal-addKPI" id="modal-addKPI">
	<div class="modal-header">
		<div class="popup-header">KPI Group <span class="close-popup" ng-click="cancel()"></span></div>
	</div>
	<div class="modal-body">
		<div class="col-sm-offset-3">
			<div class="error-message buffer-error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
				{{error}}
			</div>
			<div class="error-message hide-errormessage buffer-error-message" id="memberValid">
				Please input all required (*) fields.</div>
		</div>
		<table class="table table-bordered table-striped table-hover">
			<thead>
				<tr>
					<th>
						<input type="checkbox" ng-model="selectedAll" ng-click="checkAll(selectedAll)"/>
					</th>
					<th data-translate="Name">
					</th>
					<th data-translate="KPIGroupWeight">
					</th>
				</tr>
			</thead>
			<tr ng-repeat="group in KPIGroups">
				<td class="text-center">
					<input type="checkbox" ng-model="group.selected" />
				</td>
				<td class="kpigroup-column-max">
					{{group.name}}
				</td>
				<td class="column-weight-max text-center">
					<span ng-show="group.selected == false">{{group.weight}}</span>
					<input type="text" class="custom-form-control text-center" 
					ng-model="group.weight" ng-show="group.selected == true"/>
				</td>
			</tr>
		</table>
	</div>
	<div class="modal-footer">
		<button class="button" ng-click="ok()">
			OK</button>
		<button class="btn btn-default customize" ng-click="cancel()">
			Cancel</button>
	</div>
</div>
