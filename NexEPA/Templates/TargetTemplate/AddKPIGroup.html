<div class="modal-addKPI" id="modal-addKPI">
	<div class="modal-header">
		<div class="popup-header">
			<span data-translate="KPIGroup"></span><span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>
	<div class="modal-body">
		<div class="col-sm-offset-3">
			<div class="error-message buffer-error-message" ng-show="errors.length > 0" ng-repeat="error in errors">
				{{error}}
			</div>
			<div class="error-message hide-errormessage buffer-error-message" id="memberValid" data-translate="AllFieldRequire">
			</div>
		</div>
		<table class="table table-bordered table-striped table-hover" id="tblKPIGroup" table-row-level>
			<thead>
				<tr>
					<th class="middle-align">
						<input type="checkbox" ng-model="selectedAll" ng-click="checkAll(selectedAll)" />
					</th>
					<th class="middle-align" data-translate="Name">
					</th>
					<th class="middle-align" data-translate="KPIGroupWeight">
					</th>
					<th class="spread-weight-max middle-align" data-translate="SpreadWeight">
					</th>
					<th class="middle-align" data-translate="Priority">
					</th>
				</tr>
			</thead>
			<tbody list-sortable>
				<tr ng-repeat="group in KPIGroups" title="Drag to sort table rows">
					<td class="text-center" data-id="{{group.kpiGroupId}}">
						<input class="check-group" type="checkbox" ng-model="group.selected" />
					</td>
					<td class="kpigroup-column-max">
						{{group.name}}
					</td>
					<td class="column-weight-max text-center">
						<span ng-show="group.selected == false">{{group.weight}}</span>
						<input type="text" class="custom-form-control text-center" ng-model="group.weight"
							ng-show="group.selected == true" />
					</td>
					<td class="text-center">
						<input type="checkbox" ng-model="group.isSpreadKPI" ng-show="group.selected" />
					</td>
					<td class="text-center">
						<a href="javascript:;" title="Top" class="glyphicon glyphicon-open top"> | </a>
						<a href="javascript:;" title="Move Up" class="glyphicon glyphicon-arrow-up up"> | </a>
						<a href="javascript:;" title="Move Down" class="glyphicon glyphicon-arrow-down down"> | </a>
						<a href="javascript:;" title="Bottom" class="glyphicon glyphicon-save bottom"></a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<div class="modal-footer error-message">
		<span class="pull-left" data-translate="UncheckKPIGroupWarning"></span>
		<button class="button" ng-click="ok()" data-translate="OK">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
