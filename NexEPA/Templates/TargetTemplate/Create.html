<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="/TargetTemplate/Index" data-translate="TargetTemplate"></a>
		</li>
		<li class="current" data-translate="Create"></li>
	</ul>
</div>
<div class="row">
	<form class="col-sm-6 form-horizontal common-form" name="addTargetTemplateForm" novalidate>
	<div class="col-sm-offset-3">
		<div class="error-message" style="color: red;" ng-show="errors.length > 0"
			ng-repeat="error in errors">
			{{error}}
		</div>
		<div class="error-message hide-errormessage" id="targetTemplateValid">
			Please input all required (*) fields.</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label">
			{{"Name" | translate}}</label>
		<div class="col-sm-9">
			<input type="text" class="form-control" ng-model="template.name" placeholder="Name"
				required />
		</div>
	</div>
	<div class="form-group required">
		<label class="col-sm-3 control-label">
			{{"TargetType" | translate}}
		</label>
		<div class="col-sm-9">
			<select class="form-control" ng-options="tgType.targetTypeId as tgType.name for tgType in tgTypes"
				ng-model="template.targetTypeId" required>
				<option style="display: none" value="">-- Select a target type --</option>
			</select>
		</div>
	</div>
	<div class="form-group">
		<label class="col-sm-3 control-label" data-translate="Description">
		</label>
		<div class="col-sm-9">
			<textarea class="form-control custom-texarea" ng-model="template.description" id="description"></textarea>
		</div>
	</div>
	<div class="form-group">
		<div class="col-sm-offset-5">
			<button class="button" ng-click="addTargetTemplate(template)" data-translate="Submit">
			</button>
			<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
			</button>
		</div>
	</div>
	</form>
</div>
