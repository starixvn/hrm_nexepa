<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="/TargetTemplate/Index" data-translate="TargetTemplate"></a>
		</li>
	</ul>
	<div class="button-icon">
		<span class="icon plus"></span>
		<a href="/TargetTemplate/Create" data-translate="CreateTargetTemplate"></a>
	</div>
</div>
<div class="row">
	<table class="table table-bordered table-striped table-hover list-target-template">
		<thead>
			<tr>
				<th data-translate="Name">
				</th>
				<th data-translate="TargetType">
				</th>
				<th data-translate="Description">
				</th>
				<th data-translate="KPIs">
				</th>
				<th data-translate="Action">
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="tgtemplate in tgtemplates">
				<td class="column-limit">
					<a href="/TargetTemplate/Details/{{tgtemplate.targetTemplateId}}">{{tgtemplate.name}}</a>
				</td>
				<td class="text-center">
					{{tgtemplate.targetTypeId | targetType}}
				</td>
				<td class="description-limit">
					{{tgtemplate.description}}
				</td>
				<td class="text-center">
					<a href="/TargetTemplate/Edit/{{tgtemplate.targetTemplateId}}" ng-click="kpiSelected(true)">
						{{tgtemplate.kpIs}}</a>
				</td>
				<td class="text-center">
					<div class="btn-group">
						<a href="/TargetTemplate/Edit/{{tgtemplate.targetTemplateId}}" class="glyphicon glyphicon-edit icon-edit"
							title="Edit" ng-click="kpiSelected(false)"></a>
						<a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" ng-click="deleteTemplate(tgtemplate)"
							title="Delete"></a>
					</div>
				</td>
			</tr>
			<tr ng-show="tgtemplates == ''">
				<td class="empty-result" colspan="5" data-translate="EmptyResult">
				</td>
			</tr>
		</tbody>
	</table>
</div>
