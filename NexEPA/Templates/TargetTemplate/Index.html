<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="/TargetTemplate/Index" data-translate="TargetTemplate"></a>
		</li>
		<li class="current" data-translate="ManageTargetTemplate"></li>
	</ul>
	<a class="button-icon" href="/TargetTemplate/Create" ng-if="permission.policy == 2">
		<span class="icon plus"></span>
		<span class="button-text" data-translate="CreateTargetTemplate"></span>
	</a>
</div>
<div class="row">
	<table class="table table-bordered table-striped table-hover list-target-template">
		<thead>
			<tr>
				<th data-translate="SymbolCount">
				</th>
				<th data-translate="Name">
				</th>
				<th data-translate="TargetType">
				</th>
				<th data-translate="Description">
				</th>
				<th data-translate="KPIs">
				</th>
				<th data-translate="Active">
				</th>
				<th data-translate="Action" ng-if="permission.policy == 2">
				</th>
			</tr>
		</thead>
		<tbody>
			<tr ng-repeat="tgtemplate in tgtemplates">
				<td class="target-template-index" ng-bind="$index + 1">
				</td>
				<td class="column-limit">
					<a href="/TargetTemplate/Details/{{tgtemplate.targetTemplateId}}">{{tgtemplate.name}}</a>
				</td>
				<td class="target-template-type text-center">
					{{tgtemplate.targetTypeId | targetType}}
				</td>
				<td class="description-limit">
					{{tgtemplate.description | limitTo:tgtemplate.numLimit > 0 ? tgtemplate.numLimit
					: maxLengthDescription}}
					<a ng-show="!tgtemplate.showReadMore && (tgtemplate.description.length > 99)" href="javascript:;"
						ng-click="readMore(tgtemplate)" data-translate="ReadMore"></a>
					<a ng-show="tgtemplate.showReadMore" href="javascript:;" ng-click="readLess(tgtemplate)"
						data-translate="ReadLess"></a>
				</td>
				<td class="target-template-kpi text-center">
					<a href="/TargetTemplate/Edit/{{tgtemplate.targetTemplateId}}" ng-if="permission.policy == 2" ng-click="kpiSelected(true)">
						{{tgtemplate.kpIs}}</a>
					<span ng-if="permission.policy == 1" ng-bind="tgtemplate.kpIs"></span>
				</td>
				<td class="target-template-active text-center">
					<input type="checkbox" ng-checked="!tgtemplate.isDisabled" ng-if="permission.policy == 2" ng-click="confirmActive(tgtemplate)" />
					<img class="ico-tick" ng-if="permission.policy == 1 && !tgtemplate.isDisabled" />
				</td>
				<td class="target-template-action text-center" ng-if="permission.policy == 2">
					<div class="btn-group">
						<a href="/TargetTemplate/Edit/{{tgtemplate.targetTemplateId}}" class="glyphicon glyphicon-edit icon-edit"
							title="Edit" ng-click="kpiSelected(false)"></a>
						<a href="javascript:;" class="glyphicon glyphicon-remove icon-remove" ng-click="deleteTemplate(tgtemplate)"
							title="Delete"></a>
					</div>
				</td>
			</tr>
			<tr ng-show="tgtemplates == ''">
				<td class="empty-result" colspan="7" data-translate="EmptyResult">
				</td>
			</tr>
		</tbody>
	</table>
</div>
