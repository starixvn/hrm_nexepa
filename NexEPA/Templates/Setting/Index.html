<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li>
			<a href="#">Setting</a></li>
		<li class="current">Default Target Template</li>
	</ul>
</div>
<div class="col-sm-8">
	<form class="row form-inline filter" role="form">
	<table class="table table-bordered table-striped table-hover">
		<thead>
			<th data-translate="Target Type">
			</th>
			<th data-translate="Name">
			</th>
			<th data-translate="Action">
			</th>
		</thead>
		<tbody>
			<tr ng-repeat="setting in targetSettings">
				<td class="text-center">
					{{setting.name}}
				</td>
				<td>
					{{setting.targetTemplate.name}}
				</td>
				<td class="text-center">
					<a class="glyphicon glyphicon-edit icon-edit" href="javascript:;" 
					ng-click="defaultTargetTemplate(setting.targetTemplate.targetTemplateId, setting.targetTypeId)">
					</a>
				</td>
			</tr>
		</tbody>
	</table>
	</form>
</div>
