<div class="row sub-header">
    <ul class="col-xs-12 breadcrumb list-inline pull-left">
        <li><a href="/Flow/Index" data-translate="Flow"></a></li>
        <li class="current" data-translate="FlowManagement"></li>
    </ul>
</div>
<div class="row target-tabset">
    <tabset id="flowManagement" class="flow-management">
	<tab heading="DEPARTMENT / GROUP" class="tab-cursor" select="tabDeparment()">
		<div class="expand-user" title="Show Employee List" ng-if="!showList" ng-click="toggleShowList()">
            <span class="glyphicon glyphicon-user icon-user"></span>
        </div>
		<div class="row">   
			<div class="col-sm-3 employee-list" id="employeeList" ng-if="showList">
				<div class="row flow-header">
					<span data-translate="Employee"></span>
					<a ng-click="toggleShowList()" href="javascript:;" class="pull-right glyphicon glyphicon-arrow-left"></a>
				</div>
				<div class="row">
					<input type="text" ng-model="employeeName" class="txt-search">
				</div>
				<ul class="row custom-ul employee-ul list-unstyled">
					<li class="ui-state-highlight" list-draggable=".sortable" ng-repeat="employee in employees | filter: employeeName"
					id="{{employee.employeeId}}">
					{{employee.nickName}} ({{employee.fullName}})</li>
				</ul>
			</div>
            <div class="col-sm-9">
				 <form class="row form-inline department-form">
					<label data-translate="Department"></label>
		            <select ng-change="OnSelectedDepartment()" ng-model="EPAFlow.departmentId" class="sel-department" required>
			            <option style="display: none" value="">-- Select a Department / Group --</option>
			            <option ng-repeat="dept in departments" value="{{dept.departmentId}}">
				            {{dept.name}}</option>
		            </select>
				</form>
                <div class="row">
                    <div class="col-sm-3 col">
                        <div class="flow-group admin">
                            <div class="flow-header" >
					            <span data-translate="Admin"></span>
					            <a href="javascript:;" class="glyphicon glyphicon-plus" title="Add Admin" ng-click="addAdmin()"></a>
				            </div>
				
				            <ul list-sortable class="sortable custom-ul list-unstyled" id="adminList">
					            <li class="alert alert-info nomargin" ng-repeat="admin in admins">
							        <a href="javascript:;" class="glyphicon glyphicon-remove icon-close" ng-click="removeAdmin(admin)"></a>
						            <img tooltip="{{admin.fullName}}" class="img-flow" 
								        src="http://www.gravatar.com/avatar/{{admin.gravatar}}">
							        <p>{{admin.nickName}}</p>
					            </li>
				            </ul>
                        </div>
			        </div>
			        <div class="col-sm-3 col">
                        <div class="flow-group employee">
                            <div class="flow-header">
					            <span data-translate="Employee"></span>
				            </div>
				            <ul class="sortable custom-ul list-unstyled" id="selfList">
					            <li class="alert alert-info nomargin" ng-repeat="self in selfs">
						            <img tooltip="{{self.fullName}}" class="img-flow" src="http://www.gravatar.com/avatar/00000000000000000000000000000000?d=mm&amp;f=y">
						            <p>{{self.nickName}}</p>
					            </li>
				            </ul>
                        </div>
			        </div>
			        <div class="col-sm-3 col">
                        <div class="flow-group evaluator">
				            <div class="flow-header">
					            <span data-translate="EvaluatorTitle"></span>
					            <a href="javascript:;" class="glyphicon glyphicon-plus" title="Add Evaluator" ng-click="addEvaluator()"></a>
				            </div>
				
				            <ul list-sortable class="sortable custom-ul list-unstyled" id="evaluatorList">
					            <li class="alert alert-info nomargin" ng-repeat="evaluator in evaluators">
							        <a href="javascript:;" class="icon-close glyphicon glyphicon-remove" ng-click="removeEvaluator(evaluator)"></a>
						            <img tooltip="{{evaluator.fullName}}" class="img-flow" src="http://www.gravatar.com/avatar/{{evaluator.gravatar}}">
							        <p>{{evaluator.nickName}}</p>
					            </li>
				            </ul>
				        </div>
			        </div>
			        <div class="col-sm-3 col">
                        <div class="flow-group reviewer">
				            <div class="flow-header">
					            <span data-translate="Reviewer"></span>
					            <a href="javascript:;" class="glyphicon glyphicon-plus" title="Add Reviewer" ng-click="addReviewer()"></a>
				            </div>
				
				            <ul list-sortable class="sortable custom-ul list-unstyled" id="reviewerList">
					            <li class="alert alert-info nomargin" ng-repeat="reviewer in reviewers">
							        <a href="javascript:;" class="icon-close glyphicon glyphicon-remove" ng-click="removeReviewer(reviewer)"></a>
						            <img tooltip="{{reviewer.fullName}}" class="img-flow" src="http://www.gravatar.com/avatar/{{reviewer.gravatar}}">
							        <p>{{reviewer.nickName}}</p>
					            </li>
				            </ul>
				        </div>
			        </div>
                </div>
                <form class="row form-inline department-form" role="form">
                    <button class="button button-buffer" ng-click="saveFlow()" data-translate="Save">
		            </button>
		            <button class="button button-buffer" ng-click="deleteFlow()" data-translate="Delete"
			            ng-show="!isDisabled">
		            </button>
		            <button class="btn btn-default customize button-buffer" ng-click="cancel()" data-translate="Cancel">
		            </button>
                </form>
            </div>
		</div>
	</tab>
	<tab heading="PERSONAL" class="tab-cursor" select="tabPersonal()"></tab>
</tabset>
</div>
