<div class="modal-flow">
	<div class="modal-header">
		<div class="popup-header">
			<span data-translate="AddEmployee"></span><span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>
	<div class="modal-body">
		<div class="form-group">
			<label class="col-sm-2 control-label top-buffer" data-translate="Employee" />
			<div class="col-sm-7">
				<input class="form-control" type="text" ng-model="searchKey" search-auto-complete
					search-employees="searchEmployees" ng-change="getEmployee(searchKey)" employee="newEmployee.employee"
					maxlength="200" placeholder="nick name or full name" required id="txtManager" autofocus />
			</div>
		</div>
	</div>
	<div class="modal-footer">
		<button class="button" ng-click="ok()" data-translate="OK">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel>
		</button>
	</div>
</div>
