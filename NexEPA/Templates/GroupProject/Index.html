<div class="row sub-header">
	<ul class="breadcrumb list-inline pull-left">
		<li><a href="#" data-translate="Project"></a></li>
		<li class="current" data-translate="ManageGroupProject"></li>
	</ul>
</div>
<div class="row col-sm-8">
	<table class="table table-bordered table-striped table-group-project">
		<thead>
			<tr class="header-table">
				<th colspan="4">
					<a class="button-icon" ng-if="permission.policy == 2" ng-click="createGroupProject()">
						<span class="icon plus"></span>
						<span class="button-text" data-translate="CreateGroupProject"></span>
					</a>
				</th>
			</tr>
			<tr>
				<th class="middle-align" data-translate="SymbolCount">
				</th>
				<th class="middle-align" data-translate="GroupProjectName">
				</th>
				<th class="middle-align" data-translate="Project">
				</th>
				<th class="middle-align" data-translate="Action">
				</th>
			</tr>
		</thead>
		<tbody class="table-body">
			<tr ng-repeat="group in groupProjects">
				<td class="text-center column-count" ng-bind="$index + 1"></td>
				<td ng-bind="group.name"></td>
				<td>
					<div ng-show="group.projects.length == 1">
						<span ng-bind="group.projects[0].name"></span>
					</div>
					<div ng-show="group.projects.length > 1">
						<ul class="group-toggle-item">
							<li ng-repeat="project in group.projects" ng-bind="project.name"></li>
						</ul>
					</div>
				<td class="text-center">
					<a class="glyphicon glyphicon-edit icon-edit" href="" ng-attr-title='{{"Edit" | translate}}' 
						ng-if="permission.policy == 2" ng-click="updateGroupProject(group)"></a>
					<a class="glyphicon glyphicon-remove icon-remove" href="" ng-attr-title='{{"Delete" | translate}}'
						ng-if="permission.policy == 2" ng-click="deleteGroupProject(group)"></a>
				</td>
			</tr>
			<tr ng-show="groupProjects.length == 0">
				<td class="empty-result" colspan="4" data-translate="EmptyResult"></td>
			</tr>
		</tbody>
	</table>
</div>
