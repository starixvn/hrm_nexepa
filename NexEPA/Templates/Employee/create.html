<div class="row">
    <div class="col-md-3">
        <div class="form-group">
            <label>
                Code</label>
            <input type="text" ng-model="employee.code" class="form-control" />
        </div>
        <div class="form-group">
            <label>
                Nick Name</label>
            <input type="text" ng-model="employee.nickName" class="form-control" />
        </div>
        <div class="form-group">
            <label>
                Full Name</label>
            <input type="text" ng-model="employee.fullName" class="form-control" />
        </div>
        <div class="form-group">
            <label>
                Skype</label>
            <input type="text" ng-model="employee.skype" class="form-control" />
        </div>
        <div class="form-group">
            <label>
                Email</label>
            <input type="text" ng-model="employee.email" class="form-control" />
        </div>
        <button class="btn btn-primary" ng-click="save(employee)">
            Save</button>
    </div>
</div>
