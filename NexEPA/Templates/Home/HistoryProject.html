<div ng-controller="HistoryProjectController">
    <div class="row boxtitle" ng-click="collapseTable()">
        <span class="home-label" data-translate="ProjectHistory"></span>
    </div>

    <div class="row" collapse="isCollapsed">
        <table class="table table-bordered history-table">
            <thead>
                <th data-translate="SymbolCount"></th>
                <th data-translate="Project"></th>
                <th data-translate="ProjectManager"></th>
                <th data-translate="StartDate"></th>
                <th data-translate="EndDate"></th>
                <th data-translate="AverageScore"></th>
                <th data-translate="Role"></th>
                <th data-translate="ProjectManagerComment"></th>
            </thead>
            <tbody ng-repeat="historyProject in dashboradInformation.historyProjects">
                <tr>
                    <td class="home-index" ng-bind="$index + 1"></td>
                    <td>
                        <i class="home-collapsed" ng-click="showHideMilestone(historyProject)" 
                            ng-show="historyProject.milestones.length > 0 && !collapse.isCollapsed{{historyProject.project.projectId}}">
                        </i>
                        <i class="home-expanded"  ng-click="showHideMilestone(historyProject)"
                            ng-show="historyProject.milestones.length > 0 && collapse.isCollapsed{{historyProject.project.projectId}}"></i>
                        <a href="" ng-bind="historyProject.project.name" ng-click="EPADetail(historyProject.targetId)" ng-href={{viewEPADetailUrl}} 
                            ng-show="!historyProject.projectEvaluation && !historyProject.milestoneEvaluation" title="View detail EPA"/>
                        <a href="" ng-bind="historyProject.project.name" ng-click="EPADetail(historyProject.targetId)" ng-show="historyProject.projectEvaluation"
                            ng-href={{viewEPADetailUrl}} title="View detail EPA" />
                        <span ng-bind="historyProject.project.name" ng-show="historyProject.milestoneEvaluation" ></span>
                    </td>
                    <td>
                        <span ng-bind="historyProject.evaluator.nickName" tooltip={{historyProject.evaluator.fullName}}></span>
                    </td>
                    <td class="home-center">{{historyProject.project.startDate | customDate}}</td>
                    <td class="home-center">{{historyProject.project.endDate | customDate}}</td>
                    <td class="home-score" ng-bind="historyProject.score"></td>
                    <td class="home-role" ng-bind="historyProject.roles"></td>
                    <td class="home-comment">
                        <span ng-bind="truncateComment" original-comment="historyProject.comment" truncate tooltip={{historyProject.comment}}></span>
                    </td>
                </tr>
                <tr ng-repeat="milestone in historyProject.milestones" ng-show="collapse.isCollapsed{{historyProject.project.projectId}}"
                    ng-class="{odd: ($index % 2 == 0), even: ($index % 2 != 0)}">
                    <td class="home-index" ng-bind="$parent.$index + 1 + '.' + ($index + 1)"></td>
                    <td>
                        <a class="sub-item" href="" ng-bind="milestone.name" ng-click="EPADetail(milestone.targetId)" ng-href={{viewEPADetailUrl}} title="View detail EPA"/>
                    </td>
                    <td></td>
                    <td class="home-center">{{milestone.startDate | customDate}}</td>
                    <td class="home-center">{{milestone.endDate | customDate}}</td>
                    <td class="home-score" ng-bind="milestone.score"></td>
                    <td></td>
                    <td class="home-comment">
                        <span ng-bind="truncateComment" original-comment="milestone.comment" truncate tooltip={{milestone.comment}}></span>
                    </td>
                </tr>
                <tr ng-show="dashboradInformation.historyProjects == ''">
                    <td class="empty-result" colspan="8" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
