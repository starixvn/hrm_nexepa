<div ng-controller="HomeKPIController">
    <div class="row boxtitle" ng-click="collapseTable()">
        <span class="home-label" data-translate="MyKPI"></span>
    </div>
    <div class="row" collapse="isCollapsed">
        <table class="table table-bordered table-striped target-member-table">
            <thead>
                <tr>
                    <th data-translate="SymbolCount">
                    </th>
                    <th data-translate="KPI">
                    </th>
                    <th data-translate="EPACount">
                    </th>
                    <th data-translate="AverageScore">
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="KPIItem in dashboradInformation.listKPIs">
                    <td class="home-index" ng-bind="$index + 1"></td>
                    <td ng-bind="KPIItem.name"></td>
                    <td class="home-weight" ng-bind="KPIItem.evaluateTime"></td>
                    <td class="home-score">
                        <span ng-bind="KPIItem.averageScore | customNumber" ng-show="KPIItem.averageScore"></span>
                        <span class="glyphicon glyphicon-star" ng-show="KPIItem.averageScore"></span>
                        <span ng-show="!KPIItem.averageScore">N/A</span>
                    </td>
                </tr>
                <tr ng-show="dashboradInformation.listKPIs == ''">
                    <td class="empty-result" colspan="4" data-translate="EmptyResult"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
