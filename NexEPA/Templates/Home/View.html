<div class="row sub-header">
    <ul class="breadcrumb list-inline pull-left">
        <li><a href="#" data-translate="Home" ng-click="reload()"></a></li>
        <li class="current" data-translate="Personal"></li>
    </ul>
    <ul class="list-inline list-unstyled statistic-project pull-right">
        <li class="colons"><span class="home-label" data-translate="TotalFinishedProject"></span>
            <span class="number" ng-bind="dashboradInformation.generalInformation.totalFinishProject"></span>
        </li>
        <li>|</li>
        <li class="colons"><span class="home-label" data-translate="ProjectInProgress"></span>
            <span class="number" ng-bind="dashboradInformation.generalInformation.totalInProgressProject"></span>
        </li>
    </ul>
</div>

<div class="row" ng-show="isSimulatedLoginUser" style="margin: 10px 1%;">
    <form>
        <label>Login as another user: </label>
        <input class="form-controler" ng-model="search.searchKey" placeholder="full name or nick name" ng-change="getEmployee(search.searchKey)"
                search-auto-complete search-key="search.searchKey" search-employees="searchEmployees" employee="employee"/>
        <button class="button" ng-click="loginAsAnotherUser(employee)">Login</button>
    </form>
</div>

<div class="row container-content common-form">
    <div class="row" ng-include src="'/Templates/Home/OpenProject.html'">
    </div>
    <div class="row" ng-include src="'/Templates/Home/HistoryProject.html'">
    </div>
    <div class="row" ng-include src="'/Templates/Home/KPI.html'">
    </div>
</div>
