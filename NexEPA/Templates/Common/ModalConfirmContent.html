<div id="confirmPopup">
	<div class="modal-header">
		<div class="popup-header">
			Confirm <span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>
	<div class="modal-body">
		Are you sure you want to {{action}} <b>{{name}}</b> ?
	</div>
	<div class="modal-footer">
		<button class="button" ng-click="ok()">
			OK</button>
		<button class="btn btn-default customize" ng-click="cancel()">
			Cancel</button>
	</div>
</div>
