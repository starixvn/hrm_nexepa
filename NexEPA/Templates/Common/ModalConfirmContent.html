<div id="confirmPopup">
	<div class="modal-header">
		<div class="popup-header">
			<span data-translate="Confirm"></span><span class="close-popup" ng-click="cancel()"></span>
		</div>
	</div>
	<div class="modal-body">
		Are you sure you want to {{action}} <b>{{name}}</b> ?
	</div>
	<div class="modal-footer">
		<button class="button" ng-click="ok()" data-translate="OK">
		</button>
		<button class="btn btn-default customize" ng-click="cancel()" data-translate="Cancel">
		</button>
	</div>
</div>
